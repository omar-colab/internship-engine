# Every module carries a self-check; run them all on each push.
name: Self-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync && uv run playwright install --with-deps chromium
      - run: |
          for m in engine.ats engine.feed engine.finder engine.listener engine.resolve engine.score engine.warm engine.answers engine.report engine.resume engine.shared engine.insight engine.server; do
            uv run python -m $m
          done
          uv run python -m engine.fill --selfcheck
          uv run python -m engine.read_form --selfcheck
      - name: Offline form-fill regression fixtures
        run: uv run python -m unittest discover -s tests -p test_fill_offline.py
      - run: node --check extension/content.js && node --check extension/background.js && node --check extension/popup.js
