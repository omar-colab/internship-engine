# Every module carries a self-check; run them all on each push.
name: Self-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync && uv run playwright install --with-deps chromium
      - run: |
          for m in engine.ats engine.feed engine.finder engine.expire engine.listener engine.platform engine.resolve engine.score engine.warm engine.answers engine.report engine.resume engine.shared engine.insight engine.server; do
            uv run python -m $m
          done
          uv run python -m engine.fill --selfcheck
          uv run python -m engine.read_form --selfcheck
          uv run python scripts/demo_data.py --self-check
          uv run python scripts/store_screenshots.py --self-check
      - name: Offline Playwright regression fixtures
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check extension/content.js && node --check extension/background.js && node --check extension/popup.js
