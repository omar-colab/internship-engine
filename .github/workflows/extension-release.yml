name: Chrome extension release
on:
  push:
    tags: ["extension-v*"]
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package, validate and checksum the extension
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#extension-v}"
          archive="internship-engine-extension-${version}.zip"
          mkdir -p dist
          python3 scripts/package_extension.py --self-check
          python3 scripts/package_extension.py "$version" "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256" && sha256sum -c "$archive.sha256")
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"
      - name: Attest extension archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > dist/generated-notes.md
          {
            printf '%s\n\n' '## Install'
            printf '%s\n\n' 'Download the ZIP and follow the [GitHub install guide](https://github.com/omar-colab/internship-engine/blob/main/extension/README.md). Chrome requires Developer mode and **Load unpacked** for GitHub ZIPs. The extension also needs the local Internship Engine running on your computer.'
            cat dist/generated-notes.md
          } > dist/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --title "Internship Engine Chrome extension $version" \
            --notes-file dist/release-notes.md
