name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-and-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          # For a confirmed false positive, document the CVE, rationale, owner, and expiry here, then pass --ignore-vuln CVE-ID to pip-audit.
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Check tracked files for personal data
        run: |
          python scripts/check_tracked_data.py --self-check
          python scripts/check_tracked_data.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan changed commits with Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Scan full repository history
        if: steps.gitleaks.outcome == 'success'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/gitleaks-paths.tmpl" <<'EOF'
          {{ range . }}{{ .File }}
          {{ end }}
          EOF
          set +e
          gitleaks git --log-opts=--all --redact=100 --log-level=fatal --no-banner \
            --report-format=template --report-template="$RUNNER_TEMP/gitleaks-paths.tmpl" \
            --report-path="$RUNNER_TEMP/gitleaks-paths.txt" > "$RUNNER_TEMP/gitleaks.log" 2>&1
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ]; then
            if [ -s "$RUNNER_TEMP/gitleaks-paths.txt" ]; then
              echo "Gitleaks found an issue in repository history. Affected paths:"
              cat "$RUNNER_TEMP/gitleaks-paths.txt"
            else
              echo "Gitleaks history scan failed; scanner output is suppressed."
            fi
            exit 1
          fi
          echo "Gitleaks full-history scan passed."
