<!doctype html>
<html><body>
  <h1>Research Intern · Northwind</h1>
  <form>
    <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
    <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
    <label for="email">Email *</label><input id="email" name="email" type="email" required>
    <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="urls[LinkedIn]" type="url">
    <label for="country">Country</label>
    <select id="country" name="country"><option>Choose one</option><option>United States</option><option>Canada</option></select>
    <label for="why">What interests you about this Northwind role?</label><textarea id="why" name="why" required></textarea>
    <button type="submit">Submit application</button>
  </form>
</body></html>
