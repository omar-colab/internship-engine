<!doctype html>
<html><body>
  <h1>Product Intern · Fabrikam</h1>
  <form>
    <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
    <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
    <label for="email">Email *</label><input id="email" name="email" type="email" required>
    <fieldset>
      <legend>Are you legally eligible to work in the United States? *</legend>
      <label><input type="radio" name="eligibility" value="yes">Yes</label>
      <label><input type="radio" name="eligibility" value="no">No</label>
    </fieldset>
    <label for="gender">Gender</label>
    <select id="gender" name="gender"><option>Male</option><option>Female</option><option>I don't wish to answer</option></select>
    <button type="submit">Submit application</button>
  </form>
</body></html>
