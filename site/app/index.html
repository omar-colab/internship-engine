<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Engine</title>
<meta name="description" content="Today's internships from employers' own job boards, ranked for you, with a tracker. Free, no account; your data stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23635BFF%22/%3E%3Cg fill=%22%23fff%22%3E%3Crect x=%227%22 y=%2219%22 width=%224%22 height=%226%22 rx=%222%22/%3E%3Crect x=%2213%22 y=%2216%22 width=%224%22 height=%229%22 rx=%222%22/%3E%3Crect x=%2219%22 y=%2213%22 width=%224%22 height=%2212%22 rx=%222%22/%3E%3Crect x=%2225%22 y=%2210%22 width=%224%22 height=%2215%22 rx=%222%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #F6F9FC; --sheet: #FFFFFF; --ink: #0A2540; --ink-2: #425466; --ink-3: #697386; --line: #E3E8EE;
  --blue: #635BFF; --blue-ink: #4B44E0; --blue-soft: #EEF0FF; --green: #0E9F6E; --green-soft: #E3F8EF;
  --warm: #FFF4E5; --warm-ink: #8A4B08; --red: #D92D20; --red-soft: #FEECEB;
  --font: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(10,37,64,.06), 0 4px 12px -4px rgba(10,37,64,.08);
  --lift: 0 18px 40px -16px rgba(50,50,93,.35), 0 8px 18px -10px rgba(0,0,0,.2);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #061B31; --sheet: #0C2A48; --ink: #F6F9FC; --ink-2: #ADBDCC; --ink-3: #8098B0; --line: #1C3D5E;
  --blue: #8C86FF; --blue-ink: #A9A5FF; --blue-soft: #1E2A66; --green: #3DD9A0; --green-soft: #0D3B33;
  --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
  --shadow: 0 0 0 1px var(--line); --lift: 0 0 0 1px var(--line), 0 24px 48px -12px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #061B31; --sheet: #0C2A48; --ink: #F6F9FC; --ink-2: #ADBDCC; --ink-3: #8098B0; --line: #1C3D5E;
  --blue: #8C86FF; --blue-ink: #A9A5FF; --blue-soft: #1E2A66; --green: #3DD9A0; --green-soft: #0D3B33;
  --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
  --shadow: 0 0 0 1px var(--line); --lift: 0 0 0 1px var(--line), 0 24px 48px -12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: var(--blue-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* top bar */
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--page) 82%, transparent); backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.bar { width: min(1120px, 100%); margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.02em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--blue); display: grid; place-items: end center; padding-bottom: 6px; }
.sig { display: inline-flex; gap: 2px; align-items: flex-end; }
.sig i { width: 3.5px; border-radius: 2px; background: #fff; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button:hover { color: var(--ink); background: var(--sheet); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--page); }
.count { font-size: 11px; font-weight: 600; background: var(--blue); color: #fff; border-radius: 999px; padding: 1px 7px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #A960EE, #635BFF 55%, #90E0FF); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; flex: none; }

main { width: min(1120px, 100%); margin: 0 auto; padding: 28px 16px 80px; }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 600; margin: 0 0 6px; }
h2 { font-size: 18px; letter-spacing: -.02em; font-weight: 600; margin: 0 0 12px; }
.muted { color: var(--ink-3); }
.lede { color: var(--ink-2); font-size: 17px; margin: 0 0 24px; max-width: 60ch; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .12s ease; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.97); }
.btn.go { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.go:hover { background: var(--blue-ink); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.on { background: var(--green-soft); border-color: transparent; color: var(--green); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; user-select: none; }
.chip:has(input:checked) { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-ink); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
label.f { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
input.t, select.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 12px; }
textarea.t { min-height: 140px; resize: vertical; }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--page); color: var(--ink-2); border: 1px solid var(--line); }

/* onboarding */
.welcome { max-width: 720px; margin: 24px auto; padding: 32px; }
.welcome h1 { font-size: clamp(32px, 5vw, 46px); }
.step-dots { display: flex; gap: 6px; margin-bottom: 22px; }
.step-dots i { height: 6px; width: 28px; border-radius: 3px; background: var(--line); }
.step-dots i.on { background: var(--blue); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; gap: 12px; }

/* today */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.stat { padding: 18px; }
.stat b { display: block; font-size: 30px; letter-spacing: -.03em; font-weight: 600; line-height: 1.1; }
.stat span { color: var(--ink-3); font-size: 13px; }
.goal { display: flex; align-items: center; gap: 16px; padding: 18px; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600;
  background: radial-gradient(closest-side, var(--sheet) 76%, transparent 78%), conic-gradient(var(--blue) calc(var(--p) * 1%), var(--line) 0); }
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }

/* job rows */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
.filters input.t { flex: 1 1 240px; width: auto; }
.filters select.t { width: auto; }
.list { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; transition: box-shadow .15s ease, transform .15s ease; }
.job:hover { box-shadow: var(--lift); transform: translateY(-1px); }
.logo-tile { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 17px; }
.job h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.job .meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px 10px; flex-wrap: wrap; margin-top: 3px; }
.why { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.job .side { display: flex; gap: 8px; align-items: center; }
.fit { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; }
.fit i { width: 4px; border-radius: 2px; background: var(--line); }
.fit i.on { background: var(--blue); }
.new { font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 1px 7px; border-radius: 999px; letter-spacing: .02em; }
.more { display: flex; justify-content: center; margin-top: 16px; }
.empty { padding: 36px; text-align: center; color: var(--ink-3); }

/* tracker board */
.board { display: grid; grid-template-columns: repeat(6, minmax(168px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.lane { background: color-mix(in srgb, var(--sheet) 55%, var(--page)); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 240px; }
.lane.over { outline: 2px dashed var(--blue); }
.lane h3 { font-size: 13px; font-weight: 600; margin: 4px 6px 10px; display: flex; justify-content: space-between; color: var(--ink-2); }
.app { padding: 12px; margin-bottom: 8px; cursor: grab; }
.app:active { cursor: grabbing; }
.app b { display: block; font-size: 14px; }
.app .muted { font-size: 12.5px; }
.app select { margin-top: 8px; font-size: 12.5px; padding: 5px 8px; }
.due { color: var(--warm-ink); background: var(--warm); font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; display: inline-block; margin-top: 6px; }

dialog { border: 0; padding: 0; border-radius: 16px; background: var(--sheet); color: var(--ink); box-shadow: var(--lift); width: min(560px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(6,27,49,.45); backdrop-filter: blur(3px); }
dialog .in { position: relative; padding: 24px; display: grid; gap: 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; transition: .2s ease; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.job h3 button { all: unset; cursor: pointer; }
.job h3 button:hover { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
.job h3 button:focus-visible { outline: 3px solid var(--blue); border-radius: 4px; }
.season { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--blue-soft); color: var(--blue-ink); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; display: grid; place-items: center; flex: none; }
.detail-head { display: flex; gap: 14px; align-items: center; }
.detail-head h2 { margin: 0; font-size: 20px; }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reasons li { display: flex; gap: 8px; font-size: 14px; }
.reasons li::before { content: "✓"; color: var(--green); font-weight: 700; }
.reasons li.no::before { content: "–"; color: var(--ink-3); }
.siblings { display: grid; gap: 4px; max-height: 180px; overflow: auto; font-size: 13.5px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--ink-3); cursor: pointer; display: block; margin-bottom: 12px; }
.drop:hover { border-color: var(--blue); color: var(--blue-ink); }
kbd { font: 12px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink-3); }
@media (max-width: 860px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .cols, .grid2 { grid-template-columns: 1fr; }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; justify-content: space-around; background: var(--sheet); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); margin: 0; }
  .job { grid-template-columns: 40px 1fr; }
  .job .side { grid-column: 1 / -1; justify-content: flex-end; }
  .logo-tile { width: 40px; height: 40px; }
  .welcome { padding: 22px; }
  main { padding-bottom: 110px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="../"><span class="mark"><span class="sig"><i style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><i style="height:14px"></i></span></span>Internship Engine</a>
    <nav class="tabs" aria-label="App" hidden>
      <button data-tab="today">Today</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="tracker">Tracker <span class="count" id="trackCount" hidden></span></button>
    </nav>
    <button class="icon-btn" id="theme" title="Light / dark" aria-label="Toggle light or dark mode">◐</button>
    <button class="avatar" id="me" title="Your profile" hidden></button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<dialog id="addDlg"><form method="dialog" class="in" id="addForm">
  <h2>Add an application</h2>
  <p class="muted" style="margin:0">Applied somewhere that isn't in the feed? Track it here too.</p>
  <div class="grid2"><label class="f">Company<input class="t" name="company" required maxlength="80"></label>
  <label class="f">Role<input class="t" name="title" required maxlength="120"></label></div>
  <label class="f">Link (optional)<input class="t" name="url" type="url" placeholder="https://"></label>
  <label class="f">Stage<select class="t" name="status"></select></label>
  <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Add</button></div>
</form></dialog>

<dialog id="jobDlg"><div class="in" id="jobBody"></div></dialog>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
// Everything a visitor enters lives in this browser only (localStorage). No account, no server.
const KEY = "ie.app.v1";
const FIELDS = {
  software: ["Software", /\b(software|developer|swe|sde|backend|back-end|frontend|front-end|full[- ]?stack|web|mobile|ios|android|devops|cloud|platform|site reliability|programm)/],
  data: ["Data & AI", /\b(data|analytics?|analyst|machine learning|\bml\b|\bai\b|artificial intelligence|scien|statistic|quant)/],
  finance: ["Finance & accounting", /\b(financ|accounting|accountant|audit|tax|treasury|invest|banking|credit|risk|actuar|fp&a|wealth|capital markets)/],
  consulting: ["Consulting & strategy", /\b(consult|strategy|transformation|advisory|business analyst)/],
  product: ["Product & design", /\b(product|design|ux|ui\b|user experience|research)/],
  marketing: ["Marketing & sales", /\b(marketing|sales|brand|communications|social media|content|public relations|growth)/],
  ops: ["Operations & supply chain", /\b(operations|supply chain|logistics|procurement|sourcing|planning|inventory)/],
  engineering: ["Engineering (hardware)", /\b(mechanical|electrical|manufactur|chemical|civil|industrial|aerospace|hardware|process engineer|quality engineer)/],
  people: ["HR & people", /\b(human resources|\bhr\b|people|talent|recruit)/],
  cyber: ["Cybersecurity", /\b(cyber|security|infosec)/],
};
const STAGES = [["saved","Saved"],["applied","Applied"],["oa","Assessment"],["interview","Interview"],["offer","Offer"],["rejected","Closed"]];
const GRAD_ONLY = /\b(ph\.?d|mba|master'?s|graduate student|grad student|doctoral|postdoc|law student|\bjd\b|medical student)\b/i;
const FOLLOW_DAYS = 14;
const SEASONS = [["Summer", /summer/i], ["Fall", /\b(fall|autumn)\b/i], ["Spring", /spring/i], ["Winter", /winter/i], ["Co-op", /co-?op\b/i]];
function season(title) {
  const s = SEASONS.find(([, rx]) => rx.test(title)), y = (title.match(/\b20(2[5-9])\b/) || [])[0];
  return s ? s[0] + (y ? " " + y : "") : y || "";
}
const PAGE = 40;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const today = () => new Date().toISOString().slice(0, 10);
const daysSince = d => Math.floor((Date.now() - new Date(d).getTime()) / 864e5);

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
let S = Object.assign({ profile: null, apps: {}, seen: [], hidden: [] }, load());
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("Your browser blocked saving — use Backup to keep your data."); }
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}

// ---------- feed + matching ----------
let FEED = [], FEED_BUILT = "", NEW = new Set();
async function loadFeed() {
  try {
    const r = await fetch("../feed.json", { cache: "no-cache" });
    const d = await r.json();
    FEED_BUILT = d.built || "";
    const seenUrls = new Set(S.seen);
    FEED = (d.roles || []).filter(r => safeUrl(r.url)).map(r => ({ ...r, fields: fieldsOf(r.title) }));
    // first_seen comes from the feed builder (#48); until then, "new" means new since this visitor's last visit.
    // The oldest first_seen is the day tracking began (every role got it at once), so it never means new.
    const oldest = FEED.reduce((m, r) => r.first_seen && r.first_seen < m ? r.first_seen : m, "9999");
    FEED.forEach(r => { if (r.first_seen ? r.first_seen > oldest && daysSince(r.first_seen) <= 2 : seenUrls.size && !seenUrls.has(r.url)) NEW.add(r.url); });
    S.seen = FEED.map(r => r.url); save();
    // One role posted in many cities is one row; every city stays reachable from the detail view.
    const groups = new Map();
    for (const r of FEED) {
      const k = (r.company + "|" + r.title).toLowerCase(), g = groups.get(k);
      if (!g) { groups.set(k, { ...r, locs: [{ location: r.location, url: r.url }] }); continue; }
      g.locs.push({ location: r.location, url: r.url });
      if (NEW.has(r.url)) NEW.add(g.url);
    }
    FEED = [...groups.values()];
  } catch { FEED = []; }
}
function fieldsOf(title) {
  const t = title.toLowerCase();
  return Object.keys(FIELDS).filter(k => FIELDS[k][1].test(t));
}
const STOP = new Set("intern internship summer fall spring winter co-op coop the and for of to in a an program programs student students 2025 2026 2027 2028 analyst associate university college undergraduate early career level entry new team general corporate global time full part year years remote hybrid office north america".split(" "));
function words(s) { return (s.toLowerCase().match(/[a-z][a-z+#.&-]{2,}/g) || []).filter(w => !STOP.has(w)); }

// Score 1-5 with the reasons shown to the user. Every point has a reason; nothing is hidden.
function score(r) {
  const p = S.profile || {}, why = [];
  let s = 1;
  const hit = r.fields.filter(f => (p.fields || []).includes(f));
  if (hit.length) { s += 2; why.push(FIELDS[hit[0]][0]); }
  const locs = (r.locs || [r]).map(l => (l.location || "").toLowerCase());
  const place = (p.places || []).find(pl => pl && locs.some(l => l.includes(pl.toLowerCase())));
  if (locs.some(l => /remote/.test(l))) { s += 1; why.push("remote"); }
  else if (place) { s += 1; why.push("in " + place); }
  const rw = new Set(p.resumeWords || []);
  const overlap = [...new Set(words(r.title))].filter(w => rw.has(w));
  if (overlap.length) { s += 1; why.push("your resume mentions " + overlap.slice(0, 2).join(", ")); }
  if (GRAD_ONLY.test(r.title)) { s = 1; why.length = 0; why.push("grad school only"); }
  return { s: Math.min(5, s), why };
}
function placeOk(r, remoteOnly) {
  return (r.locs || [r]).some(({ location }) => {
    const loc = (location || "").toLowerCase();
    return /remote/.test(loc) || !remoteOnly && (S.profile.places || []).some(pl => loc.includes(pl.toLowerCase()));
  });
}
const moreLocs = r => r.locs?.length > 1 ? ` +${r.locs.length - 1} more` : "";
function initials(name) { return (name || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function tile(company) { return `<div class="logo-tile" aria-hidden="true" style="background:hsl(${hue(company)} 62% 52%)">${esc(initials(company))}</div>`; }
function fitBars(s) { return `<span class="fit" title="Match ${s} of 5" aria-label="Match ${s} of 5">${[5,8,11,14,17].map((h,i) => `<i style="height:${h}px" class="${i < s ? "on" : ""}"></i>`).join("")}</span>`; }
function ago(d) { if (!d) return ""; const n = daysSince(d); return n <= 0 ? "today" : n === 1 ? "yesterday" : n < 30 ? n + "d ago" : ""; }

function jobRow(r) {
  const { s, why } = score(r);
  const app = S.apps[r.url];
  return `<article class="card job" data-url="${esc(r.url)}">
    ${tile(r.company)}
    <div><h3><button data-act="open">${esc(r.title)}</button> ${NEW.has(r.url) ? '<span class="new">NEW</span>' : ""} ${season(r.title) ? `<span class="season">${esc(season(r.title))}</span>` : ""}</h3>
      <div class="meta"><span>${esc(r.company)}</span><span>·</span><span>${esc((r.location || "Location not listed") + moreLocs(r))}</span>${ago(r.posted || r.first_seen) ? `<span>· ${esc(ago(r.posted || r.first_seen))}</span>` : ""}</div>
      ${why.length ? `<div class="why">${fitBars(s)} &nbsp;${esc(why.join(" · "))}</div>` : `<div class="why">${fitBars(s)}</div>`}
    </div>
    <div class="side">
      <button class="btn sm ${app ? "on" : ""}" data-act="save">${app ? STAGES.find(x => x[0] === app.status)[1] : "Save"}</button>
      <a class="btn sm go" data-act="apply" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Apply ↗</a>
    </div></article>`;
}
function track(r, status) {
  const prev = S.apps[r.url];
  S.apps[r.url] = { company: r.company, title: r.title, location: r.location, url: r.url, notes: "", added: today(), ...prev, status, updated: today(), ...(["applied", "oa", "interview", "offer"].includes(status) && !prev?.applied ? { applied: today() } : {}) };
  save(); counts();
}

// ---------- job detail ----------
function openJob(r) {
  const { s, why } = score(r), p = S.profile, app = S.apps[r.url];
  const others = FEED.filter(x => x.company === r.company && x.url !== r.url);
  const missing = [];
  if (!r.fields.some(f => (p.fields || []).includes(f))) missing.push(r.fields.length ? `Field: ${r.fields.map(f => FIELDS[f][0]).join(", ")} — not one you picked` : "Field unclear from the title");
  if (!placeOk(r, false)) missing.push(`Location: ${r.location || "not listed"}`);
  if (!p.resume) missing.push("Paste your resume in your profile for skill matching");
  $("#jobBody").innerHTML = `
    <button class="icon-btn" data-act="close" aria-label="Close" style="position:absolute;top:14px;right:14px">✕</button>
    <div class="detail-head" style="padding-right:36px">${tile(r.company)}<div><h2>${esc(r.title)}</h2><div class="muted">${esc(r.company)} · ${esc((r.location || "Location not listed") + moreLocs(r))}</div></div></div>
    ${r.locs?.length > 1 ? `<div><b style="font-size:14px">Posted in ${r.locs.length} places — apply to the one you want</b><div class="siblings">${r.locs.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.location || "Location not listed")} ↗</a>`).join("")}</div></div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${fitBars(s)} <b>Match ${s} of 5</b> ${season(r.title) ? `<span class="season">${esc(season(r.title))}</span>` : ""} ${r.ats ? `<span class="tag">via ${esc(r.ats)}</span>` : ""}</div>
    <ul class="reasons">${why.map(w => `<li>${esc(w)}</li>`).join("")}${missing.map(m => `<li class="no">${esc(m)}</li>`).join("")}</ul>
    ${others.length ? `<div><b style="font-size:14px">${others.length} more at ${esc(r.company)}</b><div class="siblings">${others.slice(0, 30).map(o => `<a href="#" data-sib="${esc(o.url)}">${esc(o.title)} <span class="muted">· ${esc(o.location || "")}</span></a>`).join("")}</div></div>` : ""}
    <p class="muted" style="margin:0;font-size:13px">Tip: applying in the first few days after a posting goes up matters more than a perfect cover letter.</p>
    <div class="actions" style="margin-top:4px">
      <button class="btn sm" data-act="hide" style="color:var(--ink-3)">Not interested</button>
      <span style="display:flex;gap:8px"><button class="btn sm ${app ? "on" : ""}" data-act="save">${app ? STAGES.find(x => x[0] === app.status)[1] : "Save"}</button>
      <a class="btn sm go" data-act="apply" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Apply on ${esc(r.company)} ↗</a></span>
    </div>`;
  $("#jobBody").dataset.url = r.url;
  if (!$("#jobDlg").open) $("#jobDlg").showModal();
}
$("#jobDlg").addEventListener("click", e => { if (e.target === $("#jobDlg")) $("#jobDlg").close(); });

// ---------- views ----------
const view = $("#view");
let tab = "today", jobQuery = { q: "", field: "mine", sort: "fit", shown: PAGE, grad: false, season: "", where: "any" };

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (!S.profile) return onboarding(0);
  $("nav.tabs").hidden = $("#me").hidden = false;
  $("#me").textContent = initials(S.profile.name);
  ({ today: renderToday, jobs: renderJobs, tracker: renderTracker, profile: () => onboarding(0) })[tab]();
  window.scrollTo({ top: 0 });
}
function counts() {
  const n = Object.values(S.apps).filter(a => a.status !== "rejected").length;
  const c = $("#trackCount"); c.hidden = !n; c.textContent = n;
}
function ranked() {
  return FEED.map(r => ({ r, ...score(r) })).filter(x => !S.hidden.includes(x.r.url));
}

function renderToday() {
  const p = S.profile, apps = Object.values(S.apps);
  const all = ranked();
  const strong = all.filter(x => x.s >= 4 && !S.apps[x.r.url]).sort((a, b) => b.s - a.s || NEW.has(b.r.url) - NEW.has(a.r.url));
  const fresh = all.filter(x => NEW.has(x.r.url) && x.s >= 3).length;
  const weekAgo = Date.now() - 7 * 864e5;
  const thisWeek = apps.filter(a => a.applied && new Date(a.applied).getTime() >= weekAgo).length;
  const goal = p.goal || 10, pct = Math.min(100, Math.round(thisWeek / goal * 100));
  const due = apps.filter(a => a.status === "applied" && daysSince(a.updated) >= FOLLOW_DAYS);
  const live = apps.filter(a => ["oa", "interview"].includes(a.status));
  const hour = new Date().getHours();
  const hi = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  view.innerHTML = `
    <div class="hello"><div><h1>${hi}, ${esc(p.name.split(" ")[0])}.</h1>
      <p class="lede" style="margin:0">${fresh ? `<b>${fresh}</b> new roles fit you since your last visit.` : "Here's where your search stands."} ${FEED_BUILT ? `<span class="muted">Feed updated ${esc(ago(FEED_BUILT) || new Date(FEED_BUILT).toLocaleDateString())}.</span>` : ""}</p></div>
      <button class="btn" id="addApp">+ Add application</button></div>
    <div class="stats">
      <div class="card stat"><b>${strong.length}</b><span>strong matches to look at</span></div>
      <div class="card stat"><b>${apps.filter(a => a.applied).length}</b><span>applications sent</span></div>
      <div class="card stat"><b>${live.length}</b><span>assessments & interviews</span></div>
      <div class="card goal"><div class="ring" style="--p:${pct}">${thisWeek}/${goal}</div><div><b>This week's goal</b><div class="muted" style="font-size:13px">${thisWeek >= goal ? "Done. Nice work." : `${goal - thisWeek} more to go`}</div></div></div>
    </div>
    <div class="cols">
      <section><h2>Best for you today</h2><div class="list">${strong.slice(0, 8).map(x => jobRow(x.r)).join("") || `<div class="card empty">${FEED.length ? "No strong matches yet — add more fields or cities in your profile." : "Couldn't load today's feed. Check your connection and refresh."}</div>`}</div>
        ${strong.length > 8 ? `<div class="more"><button class="btn" data-go="jobs">See all ${strong.length} matches →</button></div>` : ""}</section>
      <aside style="display:grid;gap:20px">
        <section class="card" style="padding:18px"><h2>Follow up</h2>${due.length ? due.slice(0, 6).map(a => `<div style="padding:8px 0;border-top:1px solid var(--line)"><b style="font-size:14px">${esc(a.company)}</b><div class="muted" style="font-size:13px">${esc(a.title)} · applied ${daysSince(a.applied || a.updated)}d ago</div></div>`).join("") : `<p class="muted" style="margin:0">Nothing's gone quiet. Applications with no news for ${FOLLOW_DAYS} days show up here.</p>`}</section>
        <section class="card" style="padding:18px"><h2>Coming up</h2>${live.length ? live.map(a => `<div style="padding:8px 0;border-top:1px solid var(--line)"><b style="font-size:14px">${esc(a.company)}</b> <span class="tag">${a.status === "oa" ? "Assessment" : "Interview"}</span><div class="muted" style="font-size:13px">${esc(a.title)}</div></div>`).join("") : `<p class="muted" style="margin:0">Assessments and interviews you move on the tracker show up here.</p>`}</section>
        <section class="card" style="padding:18px"><h2>Searching with friends?</h2><p class="muted" style="margin:0 0 12px">Send them the link. Everyone gets their own private tracker.</p><button class="btn sm" id="invite">Share the app</button></section>
        <section class="card" style="padding:18px"><h2>Fill forms faster</h2><p class="muted" style="margin:0 0 12px">The Chrome extension fills the application form on the page you're on, and never clicks Submit.</p><a class="btn sm" href="https://github.com/omar-colab/internship-engine/releases/latest" target="_blank" rel="noopener">Get the extension</a></section>
      </aside>
    </div>`;
}

function renderJobs() {
  const q = jobQuery;
  view.innerHTML = `<h1>Jobs</h1><p class="lede">${FEED.length.toLocaleString()} internships pulled this morning from employers' own job boards.</p>
    <div class="filters">
      <input class="t" id="q" type="search" placeholder="Search company, role or city  ( / )" value="${esc(q.q)}" aria-label="Search">
      <select class="t" id="field" aria-label="Field"><option value="mine">My fields</option><option value="all">All fields</option>${Object.entries(FIELDS).map(([k, v]) => `<option value="${k}">${esc(v[0])}</option>`).join("")}</select>
      <select class="t" id="where" aria-label="Where"><option value="any">Anywhere</option><option value="mine">My cities + remote</option><option value="remote">Remote only</option></select>
      <select class="t" id="season" aria-label="Season"><option value="">Any season</option>${SEASONS.map(([n]) => `<option>${n}</option>`).join("")}</select>
      <select class="t" id="sort" aria-label="Sort"><option value="fit">Best match</option><option value="new">Newest</option><option value="company">Company A–Z</option></select>
      <label class="chip"><input type="checkbox" id="grad" ${q.grad ? "checked" : ""}>Show grad-only</label>
    </div><div id="results"></div>`;
  $("#field").value = q.field; $("#sort").value = q.sort; $("#where").value = q.where; $("#season").value = q.season;
  const go = () => { Object.assign(q, { q: $("#q").value, field: $("#field").value, sort: $("#sort").value, grad: $("#grad").checked, where: $("#where").value, season: $("#season").value, shown: PAGE }); results(); };
  $("#q").addEventListener("input", go); ["#field", "#sort", "#grad", "#where", "#season"].forEach(s => $(s).addEventListener("change", go));
  results();
}
function results() {
  const q = jobQuery, needle = q.q.trim().toLowerCase(), mine = S.profile.fields || [];
  let rows = ranked().filter(x =>
    (q.grad || !GRAD_ONLY.test(x.r.title)) &&
    (q.field === "all" || (q.field === "mine" ? !mine.length || x.r.fields.some(f => mine.includes(f)) : x.r.fields.includes(q.field))) &&
    (!q.season || season(x.r.title).startsWith(q.season)) &&
    (q.where === "any" || placeOk(x.r, q.where === "remote")) &&
    (!needle || `${x.r.company} ${x.r.title} ${x.r.location}`.toLowerCase().includes(needle)));
  const by = { fit: (a, b) => b.s - a.s || NEW.has(b.r.url) - NEW.has(a.r.url), new: (a, b) => NEW.has(b.r.url) - NEW.has(a.r.url) || String(b.r.posted || "").localeCompare(String(a.r.posted || "")), company: (a, b) => a.r.company.localeCompare(b.r.company) }[q.sort];
  rows.sort(by);
  $("#results").innerHTML = `<p class="muted" style="margin:0 0 10px">${rows.length.toLocaleString()} roles</p>
    <div class="list">${rows.slice(0, q.shown).map(x => jobRow(x.r)).join("") || `<div class="card empty">No roles match. Try "All fields" or a shorter search.</div>`}</div>
    ${rows.length > q.shown ? `<div class="more"><button class="btn" id="moreBtn">Show more</button></div>` : ""}`;
  $("#moreBtn")?.addEventListener("click", () => { q.shown += PAGE; results(); });
}

function renderTracker() {
  const apps = Object.values(S.apps);
  const sent = apps.filter(a => a.applied), heard = sent.filter(a => ["oa", "interview", "offer", "rejected"].includes(a.status));
  const pct = n => sent.length ? Math.round(n / sent.length * 100) + "%" : "–";
  view.innerHTML = `<div class="hello"><div><h1>Tracker</h1><p class="lede" style="margin:0">Drag cards between stages. ${apps.length ? "" : "Save a job or add one you applied to elsewhere."}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="addApp">+ Add application</button><button class="btn" id="exportBtn">Backup</button><label class="btn">Restore<input type="file" id="importIn" accept="application/json" hidden></label></div></div>
    ${sent.length ? `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="card stat"><b>${sent.length}</b><span>applied</span></div>
      <div class="card stat"><b>${pct(heard.length)}</b><span>heard back</span></div>
      <div class="card stat"><b>${pct(sent.filter(a => ["interview", "offer"].includes(a.status)).length)}</b><span>reached interview</span></div>
      <div class="card stat"><b>${sent.filter(a => a.status === "applied" && daysSince(a.updated) >= FOLLOW_DAYS).length}</b><span>to follow up</span></div></div>` : ""}
    <div class="board">${STAGES.map(([k, label]) => {
      const here = apps.filter(a => a.status === k).sort((a, b) => b.updated.localeCompare(a.updated));
      return `<section class="lane" data-stage="${k}"><h3><span>${label}</span><span>${here.length}</span></h3>${here.map(appCard).join("")}</section>`;
    }).join("")}</div>`;
  view.querySelectorAll(".lane").forEach(lane => {
    lane.addEventListener("dragover", e => { e.preventDefault(); lane.classList.add("over"); });
    lane.addEventListener("dragleave", () => lane.classList.remove("over"));
    lane.addEventListener("drop", e => { e.preventDefault(); lane.classList.remove("over"); move(e.dataTransfer.getData("text/plain"), lane.dataset.stage); });
  });
  view.querySelectorAll(".app").forEach(c => c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.url)));
}
function appCard(a) {
  const due = a.status === "applied" && daysSince(a.updated) >= FOLLOW_DAYS;
  return `<article class="card app" draggable="true" data-url="${esc(a.url)}">
    <b>${esc(a.company)}</b><div class="muted">${esc(a.title)}</div>
    ${due ? `<span class="due">Quiet ${daysSince(a.updated)} days — follow up?</span>` : ""}
    <select class="t" data-act="stage" aria-label="Stage">${STAGES.map(([k, l]) => `<option value="${k}" ${k === a.status ? "selected" : ""}>${l}</option>`).join("")}<option value="_remove">Remove</option></select>
    <textarea class="t" data-act="notes" placeholder="Notes" style="min-height:0;height:34px;margin-top:6px;font-size:12.5px">${esc(a.notes)}</textarea>
    ${safeUrl(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12.5px">Open posting ↗</a>` : ""}
  </article>`;
}
function move(url, stage) {
  if (!S.apps[url]) return;
  if (stage === "_remove") { delete S.apps[url]; save(); counts(); return renderTracker(); }
  track(S.apps[url], stage);
  if (stage === "offer") toast("An offer! Congratulations.");
  renderTracker();
}

// ---------- onboarding / profile ----------
function onboarding(step) {
  const p = stash || (S.profile ? structuredClone(S.profile) : null) || { name: "", year: new Date().getFullYear() + 2, fields: [], places: [], goal: 10, resume: "" };
  const editing = !!S.profile;
  const steps = [
    () => `<h1>${editing ? "Your profile" : "Hey! Let's find your internship."}</h1>
      <p class="lede">${editing ? "Change anything; your matches update right away." : "Two quick questions and you'll see today's roles ranked for you. No account — everything stays in this browser."}</p>
      <div class="grid2"><label class="f">First name<input class="t" id="name" required maxlength="40" value="${esc(p.name)}" autocomplete="given-name"></label>
      <label class="f">Graduating<select class="t" id="year">${[0,1,2,3,4].map(i => { const y = new Date().getFullYear() + i; return `<option ${y == p.year ? "selected" : ""}>${y}</option>`; }).join("")}</select></label></div>
      <label class="f" style="margin-top:14px">Applications per week (your goal)<input class="t" id="goal" type="number" min="1" max="100" value="${esc(p.goal)}"></label>`,
    () => `<h1>What are you looking for?</h1><p class="lede">Pick every field you'd take an internship in.</p>
      <div class="chips">${Object.entries(FIELDS).map(([k, v]) => `<label class="chip"><input type="checkbox" name="field" value="${k}" ${p.fields.includes(k) ? "checked" : ""}>${esc(v[0])}</label>`).join("")}</div>
      <label class="f" style="margin-top:20px">Cities or states you'd work in <span class="muted" style="font-weight:400">comma-separated, e.g. New York, Chicago, TX — remote always counts</span><input class="t" id="places" value="${esc(p.places.join(", "))}"></label>`,
    () => `<h1>Paste your resume <span class="muted" style="font-weight:500">(optional)</span></h1>
      <p class="lede">Paste the text of your resume and roles that match your skills rank higher. It never leaves this browser.</p>
      <label class="drop">Upload your resume PDF <span class="muted">— or paste the text below</span><input type="file" id="pdfIn" accept="application/pdf" hidden></label>
      <textarea class="t" id="resume" placeholder="Paste your resume text here">${esc(p.resume)}</textarea>`,
  ];
  view.innerHTML = `<form class="card welcome" id="ob" novalidate>
    <div class="step-dots">${steps.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
    ${steps[step]()}
    <div class="actions">${step ? `<button type="button" class="btn" id="back">Back</button>` : editing ? `<button type="button" class="btn" id="reset" style="color:var(--red)">Erase my data</button>` : "<span></span>"}
      <button class="btn go">${step < steps.length - 1 ? "Continue" : editing ? "Save" : "Show my matches →"}</button></div></form>`;
  const collect = () => {
    if ($("#name")) Object.assign(p, { name: $("#name").value.trim(), year: +$("#year").value, goal: Math.max(1, +$("#goal").value || 10) });
    if ($("#places")) Object.assign(p, { fields: [...view.querySelectorAll("input[name=field]:checked")].map(i => i.value), places: $("#places").value.split(",").map(s => s.trim()).filter(Boolean) });
    if ($("#resume")) Object.assign(p, { resume: $("#resume").value.slice(0, 20000), resumeWords: [...new Set(words($("#resume").value))] });
  };
  $("#ob").addEventListener("submit", e => {
    e.preventDefault(); collect();
    if (step === 0 && !p.name) return $("#name").focus();
    if (step < steps.length - 1) { stash = p; return onboarding(step + 1); }
    S.profile = p; save(); stash = null; tab = "today"; render(); counts();
    toast(editing ? "Saved." : `Welcome, ${p.name}!`);
  });
  $("#pdfIn")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    $(".drop").firstChild.textContent = "Reading " + f.name + "…";
    try { $("#resume").value = await pdfText(f); $(".drop").firstChild.textContent = "Read " + f.name + " ✓ "; }
    catch { $(".drop").firstChild.textContent = "Couldn't read that PDF — paste the text instead. "; }
  });
  $("#back")?.addEventListener("click", () => { collect(); stash = p; onboarding(step - 1); });
  $("#reset")?.addEventListener("click", () => { if (confirm("Erase your profile and tracker from this browser? Download a Backup first if you want to keep them.")) { localStorage.removeItem(KEY); location.reload(); } });
}
let stash = null;

// PDF text extraction happens in this browser with pdf.js (pinned + integrity-checked); the file is never uploaded.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file) {
  if (!window.pdfjsLib) {
    await new Promise((ok, fail) => {
      const sc = document.createElement("script");
      Object.assign(sc, { src: PDFJS + "pdf.min.js", integrity: "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e", crossOrigin: "anonymous", onload: ok, onerror: fail });
      document.head.append(sc);
    });
    // Workers must be same-origin, so fetch the worker with its own integrity check and run it from a blob.
    const w = await fetch(PDFJS + "pdf.worker.min.js", { integrity: "sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2" });
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await w.blob());
  }
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 5); i++) pages.push((await (await doc.getPage(i)).getTextContent()).items.map(x => x.str).join(" "));
  return pages.join("\n");
}

// ---------- events ----------
document.addEventListener("click", e => {
  const sib = e.target.closest("[data-sib]");
  if (sib) { e.preventDefault(); return openJob(FEED.find(x => x.url === sib.dataset.sib)); }
  const t = e.target.closest("[data-tab],[data-go],[data-act],#me,#addApp,#exportBtn,#theme,#invite");
  if (!t) return;
  if (t.id === "theme") {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    S.theme = document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; return save();
  }
  if (t.id === "invite") {
    const url = new URL("./", location.href).href, text = "Free internship finder + tracker — pulls roles straight from company job boards:";
    if (navigator.share) return navigator.share({ title: "Internship Engine", text, url }).catch(() => {});
    return navigator.clipboard.writeText(url).then(() => toast("Link copied — send it to a friend."), () => toast(url));
  }
  if (t.dataset.tab || t.dataset.go) { tab = t.dataset.tab || t.dataset.go; return render(); }
  if (t.id === "me") { tab = "profile"; stash = null; return render(); }
  if (t.id === "addApp") { const f = $("#addForm"); f.reset(); f.status.innerHTML = STAGES.map(([k, l]) => `<option value="${k}" ${k === "applied" ? "selected" : ""}>${l}</option>`).join(""); return $("#addDlg").showModal(); }
  if (t.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = `internship-engine-backup-${today()}.json`; a.click(); return;
  }
  const row = t.closest("[data-url]"), r = row && FEED.find(x => x.url === row.dataset.url);
  if (t.dataset.act === "close") return $("#jobDlg").close();
  if (t.dataset.act === "open" && r) return openJob(r);
  if (t.dataset.act === "hide" && r) {
    S.hidden.push(r.url); save(); $("#jobDlg").close(); render(); return toast("Hidden. You won't see it again.");
  }
  if (t.dataset.act === "save" && r) {
    if (S.apps[r.url]) { tab = "tracker"; return render(); }
    track(r, "saved"); t.classList.add("on"); t.textContent = "Saved"; toast("Saved to your tracker.");
  }
  if (t.dataset.act === "apply" && r && !S.apps[r.url]) {
    // Opening the form isn't applying; we ask when they come back so the tracker stays honest.
    pendingApply = r;
  }
});
let pendingApply = null;
document.addEventListener("keydown", e => {
  if (e.key !== "/" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]")) return;
  e.preventDefault(); if (tab !== "jobs") { tab = "jobs"; render(); } $("#q")?.focus();
});
window.addEventListener("focus", () => {
  if (!pendingApply) return;
  const r = pendingApply; pendingApply = null;
  setTimeout(() => { if (confirm(`Did you apply to ${r.company}?`)) { track(r, "applied"); toast("Tracked as applied."); render(); } }, 150);
});
document.addEventListener("change", e => {
  if (e.target.id === "importIn") return restore(e.target.files[0]);
  const card = e.target.closest(".app");
  if (!card) return;
  if (e.target.dataset.act === "stage") move(card.dataset.url, e.target.value);
  if (e.target.dataset.act === "notes") { S.apps[card.dataset.url].notes = e.target.value.slice(0, 2000); save(); }
});
async function restore(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d.apps !== "object") throw 0;
    S = Object.assign({ profile: null, apps: {}, seen: [], hidden: [] }, d); save(); counts(); render(); toast("Restored.");
  } catch { toast("That file isn't an Internship Engine backup."); }
}
$("#addDlg").addEventListener("close", () => {
  if ($("#addDlg").returnValue !== "ok") return;
  const f = $("#addForm"), url = safeUrl(f.url.value) || `manual:${Date.now()}`;
  track({ company: f.company.value.trim(), title: f.title.value.trim(), location: "", url }, f.status.value);
  toast("Added."); render();
});

if (S.theme) document.documentElement.dataset.theme = S.theme;
(async () => {
  view.innerHTML = `<div class="empty">Loading today's internships…</div>`;
  await loadFeed(); counts(); render();
})();
</script>
</body>
</html>
