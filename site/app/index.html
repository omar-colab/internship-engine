<style>
/* Ghostwrite — modernist editorial grid: 2px Night rules, square corners, Archivo, violet. */
:root {
  color-scheme: light;
  --page: #FFFFFF; --sheet: #FFFFFF; --tint: #F4F1FB; --ink: #1A0F3D; --ink-2: #3D3366; --ink-3: #6B6491; --line: #1A0F3D; --soft: #D7C9FA;
  --blue: #6538DB; --blue-ink: #4E22BC; --field: #5A2DCC; --blue-soft: #F4F1FB; --on-blue: #FFFFFF;
  --green: #0B7A52; --green-soft: #E2F5EC; --warm: #FFF2DE; --warm-ink: #8A4B08; --red: #C2261B; --red-soft: #FDECEA;
  --font: "Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --rule: 2px solid var(--line);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #120A2E; --sheet: #1A0F3D; --tint: #22145A; --ink: #F4F1FB; --ink-2: #D7C9FA; --ink-3: #A89BD6; --line: #7E6CC9; --soft: #3B2A7A;
  --blue: #A88BFA; --blue-ink: #C4B2FB; --field: #5A2DCC; --blue-soft: #2A1A63; --on-blue: #120A2E;
  --green: #45D9A5; --green-soft: #0D3B33; --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #120A2E; --sheet: #1A0F3D; --tint: #22145A; --ink: #F4F1FB; --ink-2: #D7C9FA; --ink-3: #A89BD6; --line: #7E6CC9; --soft: #3B2A7A;
  --blue: #A88BFA; --blue-ink: #C4B2FB; --field: #5A2DCC; --blue-soft: #2A1A63; --on-blue: #120A2E;
  --green: #45D9A5; --green-soft: #0D3B33; --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--tint); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: var(--blue-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }

/* the frame: one page, ruled like the brand board */
.frame { max-width: 1440px; margin: 0 auto; min-height: 100vh; background: var(--page); border-left: var(--rule); border-right: var(--rule); }
header { position: sticky; top: 0; z-index: 10; background: var(--page); border-bottom: var(--rule); }
.bar { display: flex; align-items: stretch; height: 68px; }
.logo { display: inline-flex; align-items: center; gap: 12px; padding: 0 28px; text-decoration: none; color: var(--ink); font-weight: 800; letter-spacing: -.035em; font-size: 22px; border-right: var(--rule); white-space: nowrap; }
.mark { width: 34px; height: 34px; flex: none; }
.gmark { width: 100%; height: 100%; display: block; }
nav.tabs { display: flex; }
#theme { margin-left: auto; }
nav.tabs button { border: 0; border-right: var(--rule); background: none; padding: 0 22px; font-weight: 600; font-size: 15px; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
nav.tabs button:hover { background: var(--tint); color: var(--ink); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--page); }
.count { font-size: 11px; font-weight: 700; background: var(--blue); color: #fff; padding: 1px 7px; }
nav.tabs button[aria-current="page"] .count { background: var(--soft); color: var(--ink); }
.icon-btn { width: 68px; border: 0; border-left: var(--rule); background: var(--page); cursor: pointer; display: grid; place-items: center; font-size: 18px; flex: none; color: var(--ink); }
.icon-btn:hover { background: var(--tint); }
.avatar { width: 68px; border: 0; border-left: var(--rule); background: var(--field); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; flex: none; }

main { min-height: calc(100vh - 70px); }
.band { padding: 40px 48px 32px; border-bottom: var(--rule); display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.band.violet { background: var(--field); color: #fff; }
.band.violet .eyebrow, .band.violet .lede { color: #E9E1FF; }
.eyebrow { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--blue-ink); margin-bottom: 12px; }
h1 { font-size: clamp(36px, 5vw, 64px); line-height: .98; margin: 0 0 12px; }
h2 { font-size: 22px; line-height: 1.1; margin: 0 0 14px; }
.lede { color: var(--ink-2); font-size: 18px; margin: 0; max-width: 62ch; }
.pad { padding: 28px 48px; }
.muted { color: var(--ink-3); }

.card { background: var(--sheet); border: var(--rule); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: var(--rule); background: var(--sheet); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px 16px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .12s ease, color .12s ease; }
.btn:hover { background: var(--tint); }
.btn.go { background: var(--blue); border-color: var(--blue-ink); color: #fff; }
.btn.go:hover { background: var(--blue-ink); }
.btn.big { padding: 16px 22px; font-size: 17px; min-width: 220px; justify-content: space-between; }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.btn.quiet { border-color: transparent; color: var(--ink-3); background: transparent; }
.btn.quiet:hover { color: var(--ink); background: var(--tint); }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; border: var(--rule); background: var(--sheet); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; user-select: none; }
.chip:hover { background: var(--tint); }
.chip:has(input:checked) { background: var(--ink); color: var(--page); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
input.t, select.t, textarea.t { width: 100%; border: var(--rule); background: var(--sheet); padding: 11px 12px; }
textarea.t { min-height: 140px; resize: vertical; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; background: var(--tint); color: var(--ink-2); border: 1.5px solid var(--soft); white-space: nowrap; }
.tag.good { background: var(--green-soft); color: var(--green); border-color: transparent; }
.tag.warn { background: var(--warm); color: var(--warm-ink); border-color: transparent; }
.tag.bad { background: var(--red-soft); color: var(--red); border-color: transparent; }
.tag.hot { background: var(--blue); color: #fff; border-color: transparent; }

/* onboarding: brand field on the left, the form on the right */
.ob { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; min-height: calc(100vh - 70px); }
.ob-side { background: var(--field); color: #fff; padding: 56px 48px; display: flex; flex-direction: column; gap: 28px; border-right: var(--rule); }
.ob-side h2 { font-size: clamp(34px, 4vw, 54px); line-height: .98; margin: 0; }
.ob-side p { margin: 0; color: #E9E1FF; font-size: 17px; max-width: 40ch; }
.ob-nums { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #fff; margin-top: auto; }
.ob-nums div { padding: 16px; border-right: 2px solid #fff; } .ob-nums div:last-child { border-right: 0; }
.ob-nums b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ob-nums span { font-size: 13px; color: #E9E1FF; }
.welcome { padding: 56px 48px; max-width: 760px; }
.welcome h1 { font-size: clamp(32px, 4vw, 52px); }
.welcome .lede { margin-bottom: 26px; }
.step-dots { display: flex; gap: 0; margin-bottom: 28px; border: var(--rule); width: max-content; }
.step-dots i { font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 6px 12px; border-right: var(--rule); color: var(--ink-3); }
.step-dots i:last-child { border-right: 0; } .step-dots i.on { background: var(--ink); color: var(--page); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 12px; }
.drop { border: 2px dashed var(--line); padding: 28px; text-align: center; color: var(--ink-2); cursor: pointer; display: block; margin-bottom: 12px; font-weight: 600; background: var(--tint); }
.drop:hover { border-color: var(--blue); color: var(--blue-ink); }

/* stats strip: one ruled row, like the board's grids */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: var(--rule); }
.strip > div { padding: 22px 28px; border-right: var(--rule); display: flex; gap: 16px; align-items: center; }
.strip > div:last-child { border-right: 0; }
.strip b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.strip span { color: var(--ink-3); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.goalbar { width: 100%; height: 8px; background: var(--tint); border: 1.5px solid var(--line); margin-top: 8px; }
.goalbar i { display: block; height: 100%; background: var(--blue); }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.cols > section { padding: 28px 32px 40px 48px; border-right: var(--rule); min-width: 0; }
.cols > aside { display: grid; align-content: start; min-width: 0; }
.widget { padding: 24px 28px; border-bottom: var(--rule); }
.widget h2 { font-size: 18px; margin-bottom: 8px; }
.widget .row { padding: 10px 0; border-top: 1.5px solid var(--soft); }

/* job cards */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 20px 48px; border-bottom: var(--rule); background: var(--page); }
.filters input.t { flex: 1 1 260px; width: auto; }
.filters select.t { width: auto; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 48px; border-bottom: var(--rule); background: var(--tint); align-items: center; }
.quick .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.list { display: grid; gap: 14px; }
.job { display: grid; grid-template-columns: 52px minmax(0, 1fr) 112px; gap: 18px; padding: 18px 20px; position: relative; cursor: pointer; transition: transform .12s ease, background .12s ease; }
.job:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--line); }
.job.sel { box-shadow: 6px 6px 0 var(--blue); transform: translate(-3px, -3px); border-color: var(--blue-ink); }
.job:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.logo-tile { width: 52px; height: 52px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 18px; letter-spacing: -.02em; }
.job .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin-bottom: 4px; }
.job h3 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -.025em; }
.job h3 button { all: unset; cursor: pointer; }
.job h3 button:hover { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
.job h3 button:focus-visible { outline: 3px solid var(--blue); }
.job .meta { font-size: 14px; color: var(--ink-2); display: flex; gap: 4px 14px; flex-wrap: wrap; margin-top: 6px; }
.job .meta span { display: inline-flex; gap: 5px; align-items: center; }
.job .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.job .side { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.job .side .grow { margin-left: auto; }
.why { font-size: 13px; color: var(--ink-2); margin-top: 10px; }

/* the score tile: big %, tier, fill bar — every point explained in the detail */
.score { border: var(--rule); display: grid; align-content: space-between; padding: 10px 10px 0; text-align: left; background: var(--page); align-self: start; min-height: 112px; }
.score b { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.score b small { font-size: 16px; }
.score span { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; line-height: 1.2; margin: 6px 0 10px; }
.score i { display: block; height: 8px; margin: 0 -10px; border-top: var(--rule); background: linear-gradient(90deg, var(--c) calc(var(--p) * 1%), transparent 0); }
.score.t5 { --c: var(--blue); } .score.t5 span { color: var(--blue-ink); }
.score.t4 { --c: #8E6BEA; } .score.t4 span { color: var(--blue-ink); }
.score.t3 { --c: var(--soft); } .score.t2, .score.t1 { --c: var(--soft); } .score.t1 span, .score.t2 span { color: var(--ink-3); }
.score.big { min-height: 0; padding: 16px 16px 0; }
.score.big b { font-size: 64px; } .score.big span { font-size: 13px; }
.score.big i { margin: 0 -16px; height: 12px; }
.subs { display: grid; gap: 12px; }
.sub { display: grid; grid-template-columns: 110px 1fr 54px; gap: 12px; align-items: center; font-size: 14px; }
.sub b { font-weight: 700; }
.sub .bar2 { height: 10px; border: 1.5px solid var(--line); background: var(--page); }
.sub .bar2 i { display: block; height: 100%; background: var(--blue); }
.sub em { font-style: normal; font-size: 13px; color: var(--ink-3); text-align: right; font-weight: 600; }
.sub p { grid-column: 2 / -1; margin: -6px 0 0; font-size: 13px; color: var(--ink-3); }

/* split view: list + sticky detail pane */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.split > .listcol { padding: 24px 28px 48px 48px; border-right: var(--rule); min-width: 0; }
.pane { position: sticky; top: 70px; max-height: calc(100vh - 70px); overflow: auto; min-width: 0; }
.pane .in { padding: 28px 36px 40px; display: grid; gap: 22px; }
.pane-empty { padding: 48px 36px; color: var(--ink-3); }
.pane-empty h2 { color: var(--ink); }
.detail-head { display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start; }
.detail-head h2 { margin: 0; font-size: 26px; line-height: 1.1; }
.dsec { border-top: var(--rule); padding-top: 18px; display: grid; gap: 12px; }
.dsec > h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--blue-ink); }
.scorebox { display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: start; }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.reasons li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14.5px; }
.reasons li::before { content: "✓"; color: var(--green); font-weight: 800; }
.reasons li.no::before { content: "✕"; color: var(--red); }
.reasons li.maybe::before { content: "?"; color: var(--warm-ink); }
.siblings { display: grid; gap: 4px; max-height: 200px; overflow: auto; font-size: 14px; }
.ctabar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--page); border-top: var(--rule); padding: 16px 36px; margin: 0 -36px -40px; }
.ctabar .grow { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.more { display: flex; justify-content: center; margin-top: 20px; }
.empty { padding: 40px; text-align: center; color: var(--ink-3); }
.count-line { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* companies grid: cells split by rules */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); border-top: var(--rule); border-left: var(--rule); }
.cgrid > article { border-right: var(--rule); border-bottom: var(--rule); padding: 20px; display: grid; gap: 12px; background: var(--page); }
.cgrid > article:hover { background: var(--tint); }

/* tracker board */
.board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); overflow-x: auto; border-top: var(--rule); }
.lane { border-right: var(--rule); padding: 14px; min-height: 420px; background: var(--page); }
.lane:last-child { border-right: 0; }
.lane.over { background: var(--tint); outline: 3px dashed var(--blue); outline-offset: -6px; }
.lane h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 12px; display: flex; justify-content: space-between; color: var(--ink); }
.app { padding: 12px; margin-bottom: 10px; cursor: grab; }
.app:active { cursor: grabbing; }
.app b { display: block; font-size: 15px; }
.app .muted { font-size: 13px; }
.app select { margin-top: 8px; font-size: 13px; padding: 6px 8px; }
.due { color: var(--warm-ink); background: var(--warm); font-size: 12px; font-weight: 700; padding: 2px 8px; display: inline-block; margin-top: 6px; }

dialog { border: var(--rule); padding: 0; background: var(--page); color: var(--ink); width: min(720px, calc(100% - 24px)); max-height: calc(100vh - 32px); box-shadow: 10px 10px 0 var(--line); }
dialog::backdrop { background: rgba(26,15,61,.55); }
dialog .in { position: relative; padding: 28px; display: grid; gap: 20px; }
dialog .ctabar { margin: 0 -28px -28px; padding: 16px 28px; }
.close { position: absolute; top: 0; right: 0; width: 52px; height: 52px; border: 0; border-left: var(--rule); border-bottom: var(--rule); background: var(--page); cursor: pointer; font-size: 18px; color: var(--ink); }
.close:hover { background: var(--tint); }

.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%) translateY(-12px); opacity: 0; background: var(--ink); color: var(--page); padding: 12px 18px; font-weight: 600; font-size: 14px; transition: .2s ease; pointer-events: none; z-index: 50; border: 2px solid var(--blue); }
.toast.show { opacity: 1; transform: translateX(-50%); }
kbd { font: 12px var(--font); border: 1.5px solid var(--line); border-bottom-width: 3px; padding: 0 5px; color: var(--ink-3); }

@media (max-width: 1100px) {
  .split { grid-template-columns: 1fr; }
  .split > .listcol { border-right: 0; padding: 20px 24px 48px; }
  .pane { display: none; }
  .cols { grid-template-columns: 1fr; }
  .cols > section { border-right: 0; border-bottom: var(--rule); padding: 24px; }
}
@media (max-width: 860px) {
  .frame { border: 0; }
  .band, .pad, .filters, .quick { padding-left: 16px; padding-right: 16px; }
  .band { padding-top: 24px; padding-bottom: 20px; gap: 16px; }
  .band h1 { font-size: 34px; } .band .lede { font-size: 15px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; }
  .filters input.t { flex: 0 0 210px; } .filters select.t { flex: none; }
  .quick { flex-wrap: nowrap; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; }
  .quick .chip, .quick .lbl { flex: none; }
  .band .btn.big { min-width: 0; }
  .strip { grid-template-columns: 1fr 1fr; }
  .strip > div { padding: 16px; border-bottom: var(--rule); }
  .strip > div:nth-child(2n) { border-right: 0; }
  .strip b { font-size: 30px; }
  .split > .listcol, .cols > section { padding: 16px; }
  .widget { padding: 20px 16px; }
  .ob { grid-template-columns: 1fr; }
  .ob-side { padding: 28px 16px; border-right: 0; border-bottom: var(--rule); gap: 16px; }
  .ob-side p, .ob-nums { display: none; }
  .welcome { padding: 28px 16px 120px; }
  .grid2 { grid-template-columns: 1fr; }
  .logo { padding: 0 16px; font-size: 20px; border-right: 0; }
  .bar { height: 60px; }
  header .icon-btn, header .avatar { width: 60px; }
  #theme { margin-left: auto; }

// Which missing skills show up most across the roles you'd otherwise fit: what to learn next.
const EVERYDAY = new Set(["word", "powerpoint", "presentation", "writing", "public speaking"]);   // asked everywhere, nothing to "learn next"
function skillGaps(all) {
  const mine = S.profile.fields || [], count = {};
  let n = 0;
  for (const x of all) {
    if (x.block || (mine.length && !x.r.fields.some(f => mine.includes(f)))) continue;
    const sk = skillMatch(x.r);

    n++;
    sk.missing.filter(k => !EVERYDAY.has(k)).forEach(k => count[k] = (count[k] || 0) + 1);

  const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (!S.profile.resume) return `<section class="widget"><h2>What to learn next</h2><p class="muted" style="margin:0 0 12px">Add your resume and we'll show which skills would open up the most roles for you.</p><button class="btn sm" id="me2">Add resume</button></section>`;
  if (!top.length) return "";
  const max = top[0][1];
  return `<section class="widget"><h2>What to learn next</h2>

// ---------- people you know (LinkedIn's Connections.csv, read in this browser) ----------
// Same rules as engine/warm.py: keep name, company, position, profile link; drop emails; drafts ≤ 200 chars, never sent.
const SUFFIX = /\b(inc|llc|llp|ltd|corp(oration)?|company|co|group|the|us|usa|na|holdings|plc)\b\.?/gi;
const companyKey = n => (n || "").toLowerCase().replace(SUFFIX, " ").replace(/[^a-z0-9]/g, "");
function parseCsv(text) {
  const rows = [], row = [""];
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; } else if (c === '"') q = false; else row[row.length - 1] += c; }
    else if (c === '"') q = true;
    else if (c === ",") row.push("");
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; rows.push(row.splice(0)); row.push(""); }
    else row[row.length - 1] += c;
  }
  if (row.length > 1 || row[0]) rows.push(row);
  return rows;
}
function importContacts(text) {
  const rows = parseCsv(text.replace(/^\ufeff/, "")), h = rows.findIndex(r => r[0] === "First Name");   // LinkedIn puts notes above the header
  if (h < 0) throw new Error("no header");
  const col = name => rows[h].indexOf(name);
  const [f, l, c, p, u] = ["First Name", "Last Name", "Company", "Position", "URL"].map(col);
  const before = S.contacts;
  S.contacts = rows.slice(h + 1).filter(r => r[c]).slice(0, 30000).map(r => ({ first: r[f] || "", last: r[l] || "", company: r[c], position: r[p] || "", url: safeUrl(r[u]) }));
  KNOWN = null;
  if (!save()) { S.contacts = before; KNOWN = null; throw new Error("too big"); }
  return S.contacts.length;
}
let KNOWN = null;
function known(company) {
  // Null-prototype maps: a company named "constructor" is just a company.
  if (!KNOWN) { KNOWN = { by: Object.create(null), memo: Object.create(null) }; for (const x of S.contacts || []) (KNOWN.by[companyKey(x.company)] ||= []).push(x); }
  const k = companyKey(company);
  if (k in KNOWN.memo) return KNOWN.memo[k];
  // "Booz Allen" posts; LinkedIn says "Booz Allen Hamilton". Prefix match only on distinctive keys (5+ chars).
  return KNOWN.memo[k] = k.length < 5 ? KNOWN.by[k] || [] : Object.entries(KNOWN.by).filter(([ck]) => ck === k || ck.length >= 5 && (ck.startsWith(k) || k.startsWith(ck))).flatMap(([, v]) => v);
}
function draftNote(person, r) {
  const p = S.profile, school = p.autofill?.school, who = school ? `a student at ${school}` : "a student";
  // "University - Corporate Finance Intern (NYC), Summer 2027" → "Corporate Finance Intern"
  const parts = r.title.split(/\s+[-–|]\s+|\s*[(,]\s*/).map(x => x.trim()).filter(x => x.length > 3 && !/^(university|campus|college|early careers?|summer|fall|spring|20\d\d)\b/i.test(x));
  const title = (parts.find(x => /intern|co-?op|analyst|associate|engineer/i.test(x)) || parts[0] || "internship").replace(/^(.{0,48})\s.{2,}$/s, (m, head) => m.length > 50 ? head : m);
  const opts = [`Hi ${person.first || "there"}, I'm ${p.name.split(" ")[0]}, ${who}, applying to ${r.company}'s ${title} role. Could I ask you 2 quick questions about the team?`,

// ---------- move to another device: everything travels in the #fragment, which browsers never send to a server ----------
async function pack(obj) {
  const stream = new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  let out = "";
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function unpack(text) {
  const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/")), bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text());
}
async function handoffLink() {
  // Contacts stay behind (they're other people's data and can be re-uploaded); everything else comes along.
  return `${location.origin}${location.pathname}#import=${await pack({ v: 1, profile: S.profile, apps: S.apps, hidden: S.hidden })}`;
}
async function importFromHash() {
  const m = location.hash.match(/^#import=([\w-]+)$/);
  if (!m) return;
  history.replaceState(null, "", location.pathname);          // the link holds your data; don't leave it in the address bar
  let d;
  try { d = await unpack(m[1]); } catch { return toast("That link is damaged — copy it again."); }
  if (!d || d.v !== 1 || typeof d.apps !== "object" || !d.apps || Array.isArray(d.apps)) return toast("That link isn't from Ghostwrite.");
  const n = Object.keys(d.apps).length;
  if (!confirm(`Bring over ${d.profile?.name ? d.profile.name + "'s" : "a"} profile and ${n} tracked application${n === 1 ? "" : "s"}? Your tracker here is kept; the newer copy of each application wins.`)) return;
  for (const [url, a] of Object.entries(d.apps)) {
    if (!a || typeof a !== "object") continue;
    const mine = S.apps[url];
    if (!mine || String(a.updated || "") > String(mine.updated || "")) S.apps[url] = { ...a };
  }
  if (d.profile && typeof d.profile === "object") S.profile = { ...d.profile };
  S.hidden = [...new Set([...(S.hidden || []), ...(Array.isArray(d.hidden) ? d.hidden.filter(x => typeof x === "string") : [])])];
  PV++; save(); toast("Brought over.");
}

function results() {
  const q = jobQuery, k = q.quick || {}, needle = q.q.trim().toLowerCase(), mine = S.profile.fields || [];

    (q.field === "all" || (q.field === "mine" ? !mine.length || x.r.fields.some(f => mine.includes(f)) : x.r.fields.includes(q.field))) &&
    (!q.season || season(x.r.title).startsWith(q.season)) &&
    (q.where === "any" || placeOk(x.r, q.where === "remote")) &&
    (!k.early || isEarly(x.r)) && (!k.good || x.pct >= 65) && (!k.remote || workModel(x.r) === "Remote") && (!k.pay || x.r.pay) && (!k.sponsor || (x.r.auth || []).includes("sponsor")) &&
    (!needle || `${x.r.company} ${x.r.title} ${x.r.location}`.toLowerCase().includes(needle)));
  const by = { fit: byFit, new: (a, b) => isEarly(b.r) - isEarly(a.r) || String(b.r.posted || b.r.first_seen || "").localeCompare(String(a.r.posted || a.r.first_seen || "")), company: (a, b) => a.r.company.localeCompare(b.r.company) }[q.sort];
  rows.sort(by);

    if (keep) document.querySelector(`.job[data-url="${CSS.escape(cur)}"]`)?.classList.add("sel");

    else $("#pane").innerHTML = `<div class="pane-empty"><h2>Pick a role</h2><p>Its match %, the reasons behind it, and everything you need to apply show up here.</p></div>`;

}

let stash = null;

// ---------- bridge to the Chrome extension (protocol in issue #60) ----------
const APP = "internship-engine-app", EXT = "internship-engine-ext";
let extVersion = "";
const post = msg => window.postMessage({ source: APP, ...msg }, location.origin);
function sendProfile() {
  const p = S.profile, a = p?.autofill;
  if (!extVersion || !p) return;
  const [first_name, ...rest] = p.name.split(/\s+/);
  post({ type: "profile", profile: { ...(a || {}), first_name, last_name: a?.last_name || rest.join(" "), country: "United States",
    work_authorization: p.auth || "", needs_sponsorship: p.auth === "sponsor", eeo: "decline", resume_text: p.resume || "",
    // What the extension's daily alert counts: the same field patterns this page uses, as regex sources.
    watch: { fields: (p.fields || []).map(f => FIELDS[f][1].source), places: p.places || [] } } });
}
window.addEventListener("message", e => {
  const m = e.data;
  if (e.source !== window || e.origin !== location.origin || m?.source !== EXT) return;
  if (m.type === "hello") {
    // The extension loads after this page; whichever hello came first, answering once lets queued events flow.
    if (!extVersion) post({ type: "hello" });
    extVersion = String(m.version || "1"); sendProfile(); if (tab === "today" && S.profile) renderToday(); }
  if (m.type === "events" && Array.isArray(m.events)) {
    const done = [];
    for (const ev of m.events.slice(0, 200)) {
      if (!ev || !safeUrl(ev.url) || !["saved", "applied"].includes(ev.kind)) continue;
      const prev = S.apps[ev.url];
      if (!(prev && ev.kind === "saved")) track({ company: String(ev.company || "Unknown").slice(0, 120), title: String(ev.title || "Application").slice(0, 200), location: "", url: ev.url, ...prev }, prev && prev.status !== "saved" && ev.kind === "applied" ? prev.status : ev.kind);
      done.push(ev.id);
    }
    post({ type: "ack", ids: done });
    if (done.length) { toast(`${done.length} update${done.length > 1 ? "s" : ""} from the extension.`); if (S.profile) render(); }
  }
});

// A calendar file the viewer imports themselves; floating local time, 1 hour, 1-day reminder.
function downloadIcs(a) {
  // Wall-clock arithmetic in UTC fields: "one hour later" on the clock, even across a daylight-saving change.
  const [y, mo, d, h, mi] = a.when.split(/[-T:]/).map(Number), end = new Date(Date.UTC(y, mo - 1, d, h + 1, mi));
  const pad = n => String(n).padStart(2, "0"), t = a.when.replace(/[-:]/g, "").slice(0, 13) + "00";
  const e = `${end.getUTCFullYear()}${pad(end.getUTCMonth() + 1)}${pad(end.getUTCDate())}T${pad(end.getUTCHours())}${pad(end.getUTCMinutes())}00`;
  const clean = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\r?\n/g, " ");
  const what = a.status === "oa" ? "Assessment due" : "Interview";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ghostwrite//EN", "BEGIN:VEVENT", `UID:${Date.now()}@internship-engine`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, `DTSTART:${t}`, `DTEND:${e}`,
    `SUMMARY:${clean(`${what}: ${a.company}`)}`, `DESCRIPTION:${clean(a.title + (safeUrl(a.url) ? " — " + a.url : ""))}`,
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", `DESCRIPTION:${clean(what)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  link.download = `${a.company.replace(/[^a-z0-9]+/gi, "-")}-${a.status}.ics`; link.click();
}

// PDF text extraction happens in this browser with pdf.js (pinned + integrity-checked); the file is never uploaded.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file) {
  if (!window.pdfjsLib) {
    await new Promise((ok, fail) => {
      const sc = document.createElement("script");
      Object.assign(sc, { src: PDFJS + "pdf.min.js", integrity: "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e", crossOrigin: "anonymous", onload: ok, onerror: fail });
      document.head.append(sc);
    });
    // Workers must be same-origin, so fetch the worker with its own integrity check and run it from a blob.
    const w = await fetch(PDFJS + "pdf.worker.min.js", { integrity: "sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2" });
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await w.blob());
  }
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 5); i++) {
    // Join by position: a space only where there's a visible gap, so a ligature run ("fi" + "nancial") stays one word.
    let out = "", end = null;
    for (const x of (await (await doc.getPage(i)).getTextContent()).items) {
      const xStart = x.transform?.[4];
      if (end !== null && x.str && !/\s$/.test(out) && !(xStart != null && Math.abs(xStart - end) < 1.5)) out += " ";
      out += x.str + (x.hasEOL ? "\n" : "");
      end = x.hasEOL ? null : xStart != null ? xStart + (x.width || 0) : null;
    }
    pages.push(out);
  }
  return pages.join("\n");
}

// ---------- events ----------
document.addEventListener("click", e => {
  const co = e.target.closest("[data-company]");
  if (co) { Object.assign(jobQuery, { q: co.dataset.company, field: "all", where: "any", season: "", shown: PAGE }); tab = "jobs"; return render(); }
  const ai = e.target.closest("[data-ai]");
  if (ai) { const r = FEED.find(x => x.url === ai.closest("[data-detail]")?.dataset.detail); return navigator.clipboard.writeText(aiPrompt(ai.dataset.ai, r)).then(() => toast("Prompt copied — paste it into ChatGPT, Claude or Gemini."), () => toast("Couldn't copy — your browser blocked the clipboard.")); }
  const cp = e.target.closest("[data-copy]");
  if (cp) return navigator.clipboard.writeText(cp.dataset.copy).then(() => toast("Note copied — paste it into LinkedIn yourself."), () => toast(cp.dataset.copy));
  const sib = e.target.closest("[data-sib]");
  if (sib) { e.preventDefault(); return openJob(FEED.find(x => x.url === sib.dataset.sib)); }
  const t = e.target.closest("[data-tab],[data-go],[data-act],#me,#me2,#addApp,#exportBtn,#phoneBtn,#theme,#invite");
  const card = e.target.closest(".job");
  if (!t && card && !e.target.closest("a,button,input,select,label")) return openJob(FEED.find(x => x.url === card.dataset.url));
  if (!t) return;
  if (t.id === "theme") {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    S.theme = document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; return save();
  }
  if (t.id === "invite") {
    const url = new URL("./", location.href).href, text = "Free internship finder + tracker — pulls roles straight from company job boards:";
    if (navigator.share) return navigator.share({ title: "Ghostwrite", text, url }).catch(() => {});
    return navigator.clipboard.writeText(url).then(() => toast("Link copied — send it to a friend."), () => toast(url));
  }
  if (t.dataset.tab || t.dataset.go) { tab = t.dataset.tab || t.dataset.go; return render(); }
  if (t.id === "me" || t.id === "me2") { tab = "profile"; stash = null; return render(); }
  if (t.id === "addApp") { const f = $("#addForm"); f.reset(); f.status.innerHTML = STAGES.map(([k, l]) => `<option value="${k}" ${k === "applied" ? "selected" : ""}>${l}</option>`).join(""); return $("#addDlg").showModal(); }
  if (t.id === "phoneBtn") return handoffLink().then(url => {
    // Building the link is async, which uses up the click's clipboard permission, so the copy gets its own button.
    $("#jobBody").innerHTML = `<button class="close" data-act="close" aria-label="Close">✕</button>
      <h2 id="jobTitle">Open on another device</h2>
      <p class="muted" style="margin:0">This link carries your profile and tracker (not your LinkedIn contacts). Open it on your phone or laptop and they merge in. Treat it like a password: anyone with it sees your tracker.</p>
      <input class="t" id="handoffUrl" readonly value="${esc(url)}" aria-label="Link">
      <div class="actions" style="margin-top:0"><span></span><span style="display:flex;gap:8px">${navigator.share ? `<button class="btn" id="handoffShare">Share</button>` : ""}<button class="btn go" data-copy="${esc(url)}">Copy link</button></span></div>`;
    $("#jobDlg").open || $("#jobDlg").showModal();
    $("#handoffShare")?.addEventListener("click", () => navigator.share({ title: "Ghostwrite", url }).catch(() => {}));
  });
  if (t.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = `internship-engine-backup-${today()}.json`; a.click(); return;
  }
  const row = t.closest("[data-url]"), r = row && FEED.find(x => x.url === row.dataset.url);
  if (t.dataset.act === "close") return $("#jobDlg").close();
  if (t.dataset.act === "ics") return downloadIcs(S.apps[t.closest(".app").dataset.url]);
  if (t.dataset.act === "prep") return openPrep(S.apps[t.closest(".app").dataset.url]);
  if (t.dataset.act === "open" && r) return openJob(r);
  if (t.dataset.act === "hide" && r) {
    S.hidden.push(r.url); save(); if ($("#jobDlg").open) $("#jobDlg").close();
    if (tab === "jobs" && $("#results")) { $("#pane .in")?.dataset.url === r.url && ($("#pane").innerHTML = ""); results(); } else render();
    landFocus(); return toast("Hidden. You won't see it again.");
  }
  if (t.dataset.act === "save" && r) {
    if (S.apps[r.url]) { tab = "tracker"; return render(); }
    track(r, "saved"); document.querySelectorAll(`[data-url="${CSS.escape(r.url)}"] [data-act=save]`).forEach(b => { b.classList.add("on"); b.textContent = "✓ Saved"; }); toast("Saved to your tracker.");
  }
  if (t.dataset.act === "apply" && r && !S.apps[r.url]) {
    // Opening the form isn't applying; we ask when they come back so the tracker stays honest.
    pendingApply = r;
  }
});
let pendingApply = null;
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]") || e.metaKey || e.ctrlKey) return;
  const rows = [...document.querySelectorAll(".job")], i = rows.indexOf(document.activeElement.closest?.(".job"));
  if (e.key === "j" || e.key === "k") { const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "j" ? 1 : -1)))]; n?.focus(); n?.scrollIntoView({ block: "nearest" }); }
  if (i >= 0 && (e.key === "o" || e.key === "Enter")) rows[i].querySelector("[data-act=open]").click();
  if (i >= 0 && e.key === "s") rows[i].querySelector("[data-act=save]").click();
});
document.addEventListener("keydown", e => {
  if (e.key !== "/" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]")) return;
  e.preventDefault(); if (tab !== "jobs") { tab = "jobs"; render(); } $("#q")?.focus();
});
window.addEventListener("focus", () => {
  if (!pendingApply) return;
  const r = pendingApply; pendingApply = null;
  setTimeout(() => { if (confirm(`Did you apply to ${r.company}?`)) { track(r, "applied"); toast("Tracked as applied."); render(); } }, 150);
});
document.addEventListener("change", e => {
  if (e.target.id === "importIn") return restore(e.target.files[0]);
  if (e.target.id === "csvIn") return e.target.files[0]?.text().then(t => { try { toast(`${importContacts(t).toLocaleString()} connections loaded.`); render(); } catch (err) { toast(err.message === "too big" ? "Too many connections for this browser's storage." : "That isn't LinkedIn's Connections.csv."); } });
  const card = e.target.closest(".app");
  if (!card) return;
  if (e.target.dataset.act === "stage") move(card.dataset.url, e.target.value);
  if (e.target.dataset.act === "when") { S.apps[card.dataset.url].when = e.target.value; save(); return renderTracker(); }
  if (e.target.dataset.check) { const a = S.apps[card.dataset.url]; a.checks = { ...a.checks, [e.target.dataset.check]: e.target.checked }; return save(); }
  if (e.target.dataset.act === "notes") { S.apps[card.dataset.url].notes = e.target.value.slice(0, 2000); save(); }
});
async function restore(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== "object" || !d.apps || typeof d.apps !== "object" || Array.isArray(d.apps)) throw 0;
    S = fresh(d); PV++; KNOWN = null; save(); counts(); render(); toast("Restored.");
  } catch { toast("That file isn't an Ghostwrite backup."); }
}
$("#addDlg").addEventListener("close", () => {
  if ($("#addDlg").returnValue !== "ok") return;
  const f = $("#addForm"), url = safeUrl(f.url.value) || `manual:${Date.now()}`;
  track({ company: f.company.value.trim(), title: f.title.value.trim(), location: "", url }, f.status.value);
  toast("Added."); render(); landFocus();
});
// After a dialog action rerenders the page its opener is gone; land on the page heading instead of <body>.
function landFocus() { const h = $("main h1"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }

if (S.theme) document.documentElement.dataset.theme = S.theme;
// Offline + instant load (sw.js). Failure is harmless: the page works the same without it.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  view.innerHTML = `<div class="band"><div><span class="eyebrow">Ghostwrite</span><h1>Loading today's internships…</h1></div></div>`;
  await loadFeed(); await importFromHash(); counts(); render(); post({ type: "hello" });
  // Pasting the link into a tab that already has the app open only changes the #fragment.
  window.addEventListener("hashchange", () => importFromHash().then(() => { counts(); render(); }));
})();
</script>
