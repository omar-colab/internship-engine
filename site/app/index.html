<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Engine</title>
<meta name="description" content="Today's internships from employers' own job boards, ranked for you, with a tracker. Free, no account; your data stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23635BFF%22/%3E%3Cg fill=%22%23fff%22%3E%3Crect x=%227%22 y=%2219%22 width=%224%22 height=%226%22 rx=%222%22/%3E%3Crect x=%2213%22 y=%2216%22 width=%224%22 height=%229%22 rx=%222%22/%3E%3Crect x=%2219%22 y=%2213%22 width=%224%22 height=%2212%22 rx=%222%22/%3E%3Crect x=%2225%22 y=%2210%22 width=%224%22 height=%2215%22 rx=%222%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#635BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --page: #F6F9FC; --sheet: #FFFFFF; --ink: #0A2540; --ink-2: #425466; --ink-3: #697386; --line: #E3E8EE;
  --blue: #635BFF; --blue-ink: #4B44E0; --blue-soft: #EEF0FF; --on-blue: #FFFFFF; --green: #04704F; --green-soft: #E3F8EF;
  --warm: #FFF4E5; --warm-ink: #8A4B08; --red: #D92D20; --red-soft: #FEECEB;
  --font: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(10,37,64,.06), 0 4px 12px -4px rgba(10,37,64,.08);
  --lift: 0 18px 40px -16px rgba(50,50,93,.35), 0 8px 18px -10px rgba(0,0,0,.2);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #061B31; --sheet: #0C2A48; --ink: #F6F9FC; --ink-2: #ADBDCC; --ink-3: #8098B0; --line: #1C3D5E;
  --blue: #8C86FF; --blue-ink: #A9A5FF; --blue-soft: #1E2A66; --on-blue: #061B31; --green: #3DD9A0; --green-soft: #0D3B33;
  --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
  --shadow: 0 0 0 1px var(--line); --lift: 0 0 0 1px var(--line), 0 24px 48px -12px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #061B31; --sheet: #0C2A48; --ink: #F6F9FC; --ink-2: #ADBDCC; --ink-3: #8098B0; --line: #1C3D5E;
  --blue: #8C86FF; --blue-ink: #A9A5FF; --blue-soft: #1E2A66; --on-blue: #061B31; --green: #3DD9A0; --green-soft: #0D3B33;
  --warm: #3A2A12; --warm-ink: #FFC46B; --red: #FF8A80; --red-soft: #3D1B1E;
  --shadow: 0 0 0 1px var(--line); --lift: 0 0 0 1px var(--line), 0 24px 48px -12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
a { color: var(--blue-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* top bar */
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--page) 82%, transparent); backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.bar { width: min(1120px, 100%); margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.02em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--blue); display: grid; place-items: end center; padding-bottom: 6px; }
.sig { display: inline-flex; gap: 2px; align-items: flex-end; }
.sig i { width: 3.5px; border-radius: 2px; background: #fff; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button:hover { color: var(--ink); background: var(--sheet); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--page); }
.count { font-size: 11px; font-weight: 600; background: var(--blue); color: var(--on-blue); border-radius: 999px; padding: 1px 7px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #A960EE, #635BFF 55%, #90E0FF); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; flex: none; }

main { width: min(1120px, 100%); margin: 0 auto; padding: 28px 16px 80px; }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 600; margin: 0 0 6px; }
h2 { font-size: 18px; letter-spacing: -.02em; font-weight: 600; margin: 0 0 12px; }
.muted { color: var(--ink-3); }
.lede { color: var(--ink-2); font-size: 17px; margin: 0 0 24px; max-width: 60ch; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .12s ease; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.97); }
.btn.go { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.go:hover { background: var(--blue-ink); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.on { background: var(--green-soft); border-color: transparent; color: var(--green); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; user-select: none; }
.chip:has(input:checked) { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-ink); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
label.f { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
input.t, select.t, textarea.t { width: 100%; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 12px; }
textarea.t { min-height: 140px; resize: vertical; }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--page); color: var(--ink-2); border: 1px solid var(--line); }

/* onboarding */
.welcome { max-width: 720px; margin: 24px auto; padding: 32px; }
.welcome h1 { font-size: clamp(32px, 5vw, 46px); }
.step-dots { display: flex; gap: 6px; margin-bottom: 22px; }
.step-dots i { height: 6px; width: 28px; border-radius: 3px; background: var(--line); }
.step-dots i.on { background: var(--blue); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; gap: 12px; }

/* today */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.stat { padding: 18px; }
.stat b { display: block; font-size: 30px; letter-spacing: -.03em; font-weight: 600; line-height: 1.1; }
.stat span { color: var(--ink-3); font-size: 13px; }
.goal { display: flex; align-items: center; gap: 16px; padding: 18px; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600;
  background: radial-gradient(closest-side, var(--sheet) 76%, transparent 78%), conic-gradient(var(--blue) calc(var(--p) * 1%), var(--line) 0); }
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }

/* job rows */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
.filters input.t { flex: 1 1 240px; width: auto; }
.filters select.t { width: auto; }
.list { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; transition: box-shadow .15s ease, transform .15s ease; }
.job:focus { outline: 2px solid var(--blue); outline-offset: 2px; }
.job:hover { box-shadow: var(--lift); transform: translateY(-1px); }
.logo-tile { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 17px; }
.job h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.job .meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px 10px; flex-wrap: wrap; margin-top: 3px; }
.why { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.job .side { display: flex; gap: 8px; align-items: center; }
.fit { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; }
.fit i { width: 4px; border-radius: 2px; background: var(--line); }
.fit i.on { background: var(--blue); }
.new { font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 1px 7px; border-radius: 999px; letter-spacing: .02em; }
.more { display: flex; justify-content: center; margin-top: 16px; }
.empty { padding: 36px; text-align: center; color: var(--ink-3); }

/* tracker board */
.board { display: grid; grid-template-columns: repeat(6, minmax(168px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.lane { background: color-mix(in srgb, var(--sheet) 55%, var(--page)); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 240px; }
.lane.over { outline: 2px dashed var(--blue); }
.lane h3 { font-size: 13px; font-weight: 600; margin: 4px 6px 10px; display: flex; justify-content: space-between; color: var(--ink-2); }
.app { padding: 12px; margin-bottom: 8px; cursor: grab; }
.app:active { cursor: grabbing; }
.app b { display: block; font-size: 14px; }
.app .muted { font-size: 12.5px; }
.app select { margin-top: 8px; font-size: 12.5px; padding: 5px 8px; }
.due { color: var(--warm-ink); background: var(--warm); font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; display: inline-block; margin-top: 6px; }

dialog { border: 0; padding: 0; border-radius: 16px; background: var(--sheet); color: var(--ink); box-shadow: var(--lift); width: min(560px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(6,27,49,.45); backdrop-filter: blur(3px); }
dialog .in { position: relative; padding: 24px; display: grid; gap: 14px; }

.toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%) translateY(-12px); opacity: 0; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; transition: .2s ease; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.job h3 button { all: unset; cursor: pointer; }
.job h3 button:hover { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 3px; }
.job h3 button:focus-visible { outline: 3px solid var(--blue); border-radius: 4px; }
.season { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--blue-soft); color: var(--blue-ink); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; display: grid; place-items: center; flex: none; }
.detail-head { display: flex; gap: 14px; align-items: center; }
.detail-head h2 { margin: 0; font-size: 20px; }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reasons li { display: flex; gap: 8px; font-size: 14px; }
.reasons li::before { content: "✓"; color: var(--green); font-weight: 700; }
.reasons li.no::before { content: "–"; color: var(--ink-3); }
.siblings { display: grid; gap: 4px; max-height: 180px; overflow: auto; font-size: 13.5px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--ink-3); cursor: pointer; display: block; margin-bottom: 12px; }
.drop:hover { border-color: var(--blue); color: var(--blue-ink); }
kbd { font: 12px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--ink-3); }
@media (max-width: 860px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .cols, .grid2 { grid-template-columns: 1fr; }
  header { backdrop-filter: none; background: var(--page); }
  #theme { margin-left: auto; }   /* a filtered ancestor would pin the fixed nav to the header */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; justify-content: space-around; background: var(--sheet); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); margin: 0; }
  .job { grid-template-columns: 40px 1fr; }
  .job .side { grid-column: 1 / -1; justify-content: flex-end; }
  .logo-tile { width: 40px; height: 40px; }
  .welcome { padding: 22px; }
  main { padding-bottom: 110px; }
  .btn.sm, nav.tabs button, .chip { min-height: 44px; }
  .icon-btn, .avatar { width: 44px; height: 44px; }
  .toast { top: auto; bottom: calc(84px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .btn:active, .job:hover { transform: none; }
  .toast, .toast.show { transform: translateX(-50%); }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="../"><span class="mark"><span class="sig"><i style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><i style="height:14px"></i></span></span>Internship Engine</a>
    <nav class="tabs" aria-label="App" hidden>
      <button data-tab="today">Today</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="companies">Companies</button>
      <button data-tab="tracker">Tracker <span class="count" id="trackCount" hidden></span></button>
    </nav>
    <button class="icon-btn" id="theme" title="Light / dark" aria-label="Toggle light or dark mode">◐</button>
    <button class="avatar" id="me" title="Your profile" hidden></button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<dialog id="addDlg" aria-labelledby="addTitle"><form method="dialog" class="in" id="addForm">
  <h2 id="addTitle">Add an application</h2>
  <p class="muted" style="margin:0">Applied somewhere that isn't in the feed? Track it here too.</p>
  <div class="grid2"><label class="f">Company<input class="t" name="company" required maxlength="80"></label>
  <label class="f">Role<input class="t" name="title" required maxlength="120"></label></div>
  <label class="f">Link (optional)<input class="t" name="url" type="url" placeholder="https://"></label>
  <label class="f">Stage<select class="t" name="status"></select></label>
  <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Add</button></div>
</form></dialog>

<dialog id="jobDlg" aria-labelledby="jobTitle"><div class="in" id="jobBody"></div></dialog>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
// Everything a visitor enters lives in this browser only (localStorage). No account, no server.
const KEY = "ie.app.v1";
const FIELDS = {
  software: ["Software", /\b(software|developer|swe|sde|backend|back-end|frontend|front-end|full[- ]?stack|web|mobile|ios|android|devops|cloud|platform|site reliability|programm|\bsw\b|\bit\b|information technology|infrastructure|servicenow|technology|systems administrator|information systems|business systems|application develop|technologist)/],
  data: ["Data & AI", /\b(data|analytics?|analyst|machine learning|\bml\b|\bai\b|artificial intelligence|scien|statistic|quant|power bi|\bbi\b|insights|business intelligence|geographic information|\bgis\b|research assistant)/],
  finance: ["Finance & accounting", /\b(financ|accounting|accountant|audit|tax|treasury|invest|banking|credit|risk|actuar|fp&a|wealth|capital markets|claims|underwrit|insurance|lending|loan|branch intern|trust|assurance|pricing|payroll|retirement|trade desk|real estate|private equity|fund|private client|endowment)/],
  consulting: ["Consulting & business", /\b(consult|strategy|transformation|advisory|business analyst|business intern|leadership development|rotational|general management|management intern|performance improvement|corporate development|business intern|business\/)/],
  product: ["Product & design", /\b(product (manag|design|owner|market|defin|analy|develop)|technical product|design|ux|ui\b|user experience|user research)/],
  marketing: ["Marketing & sales", /\b(marketing|sales|brand|communications|social media|content|public relations|growth|copywrit|photograph|community|merchandis|business development|partnership|customer success|e-?commerce|go-to-market|customer experience|dealer|market research|strateg|events?\b)/],
  ops: ["Operations & supply chain", /\b(operations|supply chain|logistics|procurement|sourcing|planning|inventory|operational excellence|project manag|program manag|order|customer support|construction|facilities|contracts|supplier|network expansion|production|estimat|ops\b|project coordinat|process improvement|land planner)/],
  engineering: ["Engineering (hardware)", /\b(mechanical|electrical|manufactur|chemical|civil|industrial|aerospace|hardware|process engineer|quality engineer|systems engineer|engineer(ing)? intern|aero|robotic|autonomy|gnc|r&d|research and development|test engineer|machinist|multiphysics|packaging|motor|architect|environmental|safety|hse|mechatronic|controls|power systems|transmission|relay|wind|energy|utilit|electric|substation|lab testing|nuclear|mechanic|mining|ready mix|eh&s)/],
  people: ["HR & people", /\b(human resources|\bhr\b|people|talent|recruit|learning|change management)/],
  health: ["Healthcare & science", /\b(pharm|clinical|health|biolog|chemi|medical|nurs|patient|(?<!data )scientist|laborator|biotech|life science)/],
  policy: ["Policy, legal & government", /\b(legal|law\b|policy|government|congressional|public affairs|regulatory|compliance)/],
  cyber: ["Cybersecurity", /\b(cyber|security|infosec|identity|access management|\biam\b)/],
};
const STAGES = [["saved","Saved"],["applied","Applied"],["oa","Assessment"],["interview","Interview"],["offer","Offer"],["rejected","Closed"]];
const LANE_HINT = { saved: "Hit Save on any job.", applied: "Apply, then confirm you sent it.", oa: "Got a test? Move the card here.", interview: "Booked a call? Move it here.", offer: "The good part.", rejected: "Rejections and closed roles." };
const GRAD_ONLY = /\b(ph\.?d|mba|master'?s|graduate student|grad student|doctoral|postdoc|law student|\bjd\b|medical student)\b/i;
const FOLLOW_DAYS = 14;
const CHECKS = [["tailored", "Resume tailored"], ["referral", "Asked for a referral"], ["thanks", "Followed up / thank-you sent"]];
const SEASONS = [["Summer", /summer/i], ["Fall", /\b(fall|autumn)\b/i], ["Spring", /spring/i], ["Winter", /winter/i], ["Co-op", /co-?op\b/i]];
function season(title) {
  const s = SEASONS.find(([, rx]) => rx.test(title)), y = (title.match(/\b20(2[5-9])\b/) || [])[0];
  return s ? s[0] + (y ? " " + y : "") : y || "";
}
const PAGE = 40;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const today = () => new Date().toISOString().slice(0, 10);
const daysSince = d => Math.floor((Date.now() - new Date(d).getTime()) / 864e5);

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
// Spread (not Object.assign) so a "__proto__" key in stored or restored JSON stays an inert own property.
const fresh = d => ({ profile: null, apps: {}, seen: [], hidden: [], contacts: [], ...d });
let S = fresh(load());
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch { toast("Your browser blocked saving — use Backup to keep your data."); return false; }
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}

// ---------- feed + matching ----------
let FEED = [], FEED_BUILT = "", NEW = new Set();
async function loadFeed() {
  try {
    const r = await fetch("../feed.json", { cache: "no-cache" });
    const d = await r.json();
    FEED_BUILT = d.built || "";
    const seenUrls = new Set(S.seen);
    FEED = (d.roles || []).filter(r => r && safeUrl(r.url) && typeof r.title === "string" && r.title).map(r => ({ ...r, company: String(r.company || "Unknown"), location: calm(r.location) })).map(r => ({ ...r, fields: fieldsOf(r.title, r.skills) }));
    // first_seen comes from the feed builder (#48); until then, "new" means new since this visitor's last visit.
    // The oldest first_seen is the day tracking began (every role got it at once), so it never means new.
    const oldest = FEED.reduce((m, r) => r.first_seen && r.first_seen < m ? r.first_seen : m, "9999");
    FEED.forEach(r => { if (r.first_seen ? r.first_seen > oldest && daysSince(r.first_seen) <= 2 : seenUrls.size && !seenUrls.has(r.url)) NEW.add(r.url); });
    // With first_seen in the feed, "new" needs no memory here; otherwise remember URLs (the fallback costs ~100 KB per 1,000 roles).
    S.seen = FEED.some(r => r.first_seen) ? [] : FEED.map(r => r.url); save();
    // One role posted in many cities is one row; every city stays reachable from the detail view.
    const groups = new Map();
    for (const r of FEED) {
      const k = r.company !== "Unknown" ? JSON.stringify([r.company.toLowerCase(), r.title.toLowerCase()]) : r.url, g = groups.get(k);

async function pack(obj) {

  const bytes = new Uint8Array(await new Response(stream).arrayBuffer());

}

  if (!d || d.v !== 1 || typeof d.apps !== "object" || !d.apps || Array.isArray(d.apps)) return toast("That link isn't from Internship Engine.");
  const n = Object.keys(d.apps).length;

// Same match score → more of the asked skills you have → newer → posted sooner.
function tiebreak(x) {
  const sk = skillMatch(x.r);
  return (sk ? sk.have.length / sk.asked.length : 0) + (NEW.has(x.r.url) ? 0.5 : 0);
}
const byFit = (a, b) => b.s - a.s || tiebreak(b) - tiebreak(a) || String(b.r.first_seen || "").localeCompare(String(a.r.first_seen || ""));
function ranked() {
  return FEED.map(r => ({ r, ...score(r) })).filter(x => !S.hidden.includes(x.r.url));
}

function results() {
  const q = jobQuery, needle = q.q.trim().toLowerCase(), mine = S.profile.fields || [];
  let rows = ranked().filter(x =>
    (q.grad || !x.block) &&
    (q.field === "all" || (q.field === "mine" ? !mine.length || x.r.fields.some(f => mine.includes(f)) : x.r.fields.includes(q.field))) &&
    (!q.season || season(x.r.title).startsWith(q.season)) &&
    (q.where === "any" || placeOk(x.r, q.where === "remote")) &&
    (!needle || `${x.r.company} ${x.r.title} ${x.r.location}`.toLowerCase().includes(needle)));
  const by = { fit: byFit, new: (a, b) => NEW.has(b.r.url) - NEW.has(a.r.url) || String(b.r.posted || b.r.first_seen || "").localeCompare(String(a.r.posted || a.r.first_seen || "")), company: (a, b) => a.r.company.localeCompare(b.r.company) }[q.sort];
  rows.sort(by);
  $("#results").innerHTML = `<p class="muted" style="margin:0 0 10px">${rows.length.toLocaleString()} roles</p>

  $("#moreBtn")?.addEventListener("click", () => { q.shown += PAGE; results(); });
}

let companyQuery = "";
function renderCompanies() {
  const by = new Map();
  for (const x of ranked()) {
    if (x.block) continue;
    const c = by.get(x.r.company) || { name: x.r.company, roles: 0, best: 0, top: null, fields: new Set() };
    c.roles++; x.r.fields.forEach(f => c.fields.add(f));
    if (x.s > c.best) { c.best = x.s; c.top = x.r; }
    by.set(x.r.company, c);
  }
  const all = [...by.values()].map(c => ({ ...c, people: known(c.name).length, applied: Object.values(S.apps).filter(a => a.company === c.name && a.applied).length }))
    .sort((a, b) => b.people - a.people || b.best - a.best || b.roles - a.roles);
  view.innerHTML = `<h1>Companies</h1><p class="lede">${all.length.toLocaleString()} employers hiring interns you can apply to. People you know come first.</p>
    <div class="filters"><input class="t" id="cq" type="search" placeholder="Search companies" value="${esc(companyQuery)}" aria-label="Search companies"></div>
    <div id="clist" class="list" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))"></div>`;
  const draw = () => {
    const q = companyQuery.toLowerCase();
    $("#clist").innerHTML = all.filter(c => !q || c.name.toLowerCase().includes(q)).slice(0, 120).map(c => `
      <article class="card" style="padding:16px;display:grid;gap:10px">
        <div style="display:flex;gap:12px;align-items:center">${tile(c.name)}<div><b>${esc(c.name)}</b><div class="muted" style="font-size:13px">${c.roles} role${c.roles > 1 ? "s" : ""} · best match ${c.best}/5</div></div></div>
        <div class="chips">${c.people ? `<span class="tag" style="background:var(--green-soft);color:var(--green);border-color:transparent">${c.people} you know</span>` : ""}${c.applied ? `<span class="tag">applied ${c.applied}</span>` : ""}${[...c.fields].slice(0, 2).map(f => `<span class="tag">${esc(FIELDS[f][0])}</span>`).join("")}</div>
        <button class="btn sm" data-company="${esc(c.name)}">See roles</button>
      </article>`).join("") || `<div class="card empty">No company matches "${esc(companyQuery)}".</div>`;
  };
  $("#cq").addEventListener("input", e => { companyQuery = e.target.value; draw(); });
  draw();
}

function renderTracker() {
  const apps = Object.values(S.apps);
  const sent = apps.filter(a => a.applied), heard = sent.filter(a => ["oa", "interview", "offer", "rejected"].includes(a.status));
  const pct = n => sent.length ? Math.round(n / sent.length * 100) + "%" : "–";
  view.innerHTML = `<div class="hello"><div><h1>Tracker</h1><p class="lede" style="margin:0">Drag cards or pick a stage on each card. ${apps.length ? "" : "Save a job or add one you applied to elsewhere."}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="addApp">+ Add application</button><button class="btn" id="phoneBtn">Open on another device</button><button class="btn" id="exportBtn">Backup</button><label class="btn">Restore<input type="file" id="importIn" accept="application/json" hidden></label></div></div>
    ${sent.length ? `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="card stat"><b>${sent.length}</b><span>applied</span></div>
      <div class="card stat"><b>${pct(heard.length)}</b><span>heard back</span></div>
      <div class="card stat"><b>${pct(sent.filter(a => ["interview", "offer"].includes(a.status)).length)}</b><span>reached interview</span></div>
      <div class="card stat"><b>${sent.filter(a => a.status === "applied" && daysSince(a.updated) >= FOLLOW_DAYS).length}</b><span>to follow up</span></div></div>` : ""}
    <div class="board">${STAGES.map(([k, label]) => {
      const here = apps.filter(a => a.status === k).sort((a, b) => b.updated.localeCompare(a.updated));
      return `<section class="lane" data-stage="${k}"><h3><span>${label}</span><span>${here.length}</span></h3>${here.length ? here.map(appCard).join("") : `<p class="muted" style="font-size:13px;margin:4px 0 0">${LANE_HINT[k]}</p>`}</section>`;
    }).join("")}</div>`;
  view.querySelectorAll(".lane").forEach(lane => {
    lane.addEventListener("dragover", e => { e.preventDefault(); lane.classList.add("over"); });
    lane.addEventListener("dragleave", () => lane.classList.remove("over"));

  });
  view.querySelectorAll(".app").forEach(c => c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.url)));
}
function appCard(a) {
  const due = a.status === "applied" && daysSince(a.updated) >= FOLLOW_DAYS;
  return `<article class="card app" draggable="true" data-url="${esc(a.url)}">
    <b>${esc(a.company)}</b><div class="muted">${esc(a.title)}</div>

    <select class="t" data-act="stage" aria-label="Stage">${STAGES.map(([k, l]) => `<option value="${k}" ${k === a.status ? "selected" : ""}>${l}</option>`).join("")}<option value="_remove">Remove</option></select>
    ${["oa", "interview"].includes(a.status) ? `<label class="muted" style="display:block;margin-top:6px;font-size:12px">${a.status === "oa" ? "Due" : "When"}<input class="t" type="datetime-local" data-act="when" value="${esc(a.when || "")}" style="font-size:12.5px;padding:5px 8px"></label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${a.when ? `<button class="btn sm" data-act="ics">Add to calendar</button>` : ""}<button class="btn sm" data-act="prep">Prep</button></div>` : ""}
    ${a.status !== "saved" ? `<div style="display:grid;gap:2px;margin-top:6px;font-size:12.5px">${CHECKS.map(([k, l]) => `<label><input type="checkbox" data-check="${k}" ${a.checks?.[k] ? "checked" : ""}> ${l}</label>`).join("")}</div>` : ""}
    <textarea class="t" data-act="notes" placeholder="Notes" style="min-height:0;height:34px;margin-top:6px;font-size:12.5px">${esc(a.notes)}</textarea>
    ${safeUrl(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12.5px">Open posting ↗</a>` : ""}
  </article>`;
}
function move(url, stage) {
  if (!S.apps[url]) return;
  if (stage === "_remove") { delete S.apps[url]; save(); counts(); return renderTracker(); }
  track(S.apps[url], stage);
  if (stage === "offer") toast("An offer! Congratulations.");
  renderTracker();
}

      <label class="f">Degree<select class="t" id="af_degree_type">${["Bachelor's", "Associate's", "Master's"].map(d => `<option ${d === (a.degree_type || "Bachelor's") ? "selected" : ""}>${d}</option>`).join("")}</select></label>
      <label class="f">Graduation month<select class="t" id="af_month">${["05", "06", "08", "12", "01", "03"].map(m => `<option value="${m}" ${m === (a.graduation || "-05").slice(5) ? "selected" : ""}>${new Date(2000, m - 1).toLocaleString([], { month: "long" })}</option>`).join("")}</select></label></div>
      <p class="muted" style="font-size:13px;margin:14px 0 0">Demographic questions are always answered "decline to self-identify". SSN, birth date and passwords are never stored or filled.</p>`; },
  ];
  view.innerHTML = `<form class="card welcome" id="ob" novalidate>
    <div class="step-dots">${steps.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
    ${steps[step]()}
    <div class="actions">${step ? `<button type="button" class="btn" id="back">Back</button>` : editing ? `<button type="button" class="btn" id="reset" style="color:var(--red)">Erase my data</button>` : "<span></span>"}
      <button class="btn go">${step < steps.length - 1 ? "Continue" : editing ? "Save" : "Show my matches →"}</button></div></form>`;
  const collect = () => {
    if ($("#name")) Object.assign(p, { name: $("#name").value.trim(), year: +$("#year").value, auth: $("#auth").value, goal: Math.max(1, +$("#goal").value || 10) });
    if ($("#places")) Object.assign(p, { fields: [...view.querySelectorAll("input[name=field]:checked")].map(i => i.value), places: $("#places").value.split(",").map(s => s.trim()).filter(Boolean) });
    if ($("#af_email")) {
      const v = id => $("#af_" + id).value.trim();
      p.autofill = Object.fromEntries(["last_name", "email", "phone", "linkedin", "city", "state", "school", "major", "degree_type"].map(k => [k, v(k)]));
      p.autofill.graduation = `${p.year}-${$("#af_month").value}`;
    }
    if ($("#resume")) Object.assign(p, { resume: $("#resume").value.slice(0, 20000), resumeWords: [...new Set(words($("#resume").value))] });
  };
  $("#ob").addEventListener("submit", e => {
    e.preventDefault(); collect();
    if (step === 0 && !p.name) return $("#name").focus();
    if (step < steps.length - 1) { stash = p; return onboarding(step + 1); }
    S.profile = p; PV++; save(); stash = null; tab = "today"; render(); counts(); sendProfile();
    toast(editing ? "Saved." : `Welcome, ${p.name}!`);
  });
  $("#pdfIn")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    $(".drop").firstChild.textContent = "Reading " + f.name + "…";
    try { $("#resume").value = await pdfText(f); $(".drop").firstChild.textContent = "Read " + f.name + " ✓ "; }
    catch { $(".drop").firstChild.textContent = "Couldn't read that PDF — paste the text instead. "; }
  });
  $("#unhide")?.addEventListener("click", e => { S.hidden = []; save(); e.target.remove(); toast("Hidden jobs are back."); });
  $("#back")?.addEventListener("click", () => { collect(); stash = p; onboarding(step - 1); });
  $("#reset")?.addEventListener("click", () => { if (confirm("Erase your profile and tracker from this browser? Download a Backup first if you want to keep them.")) { localStorage.removeItem(KEY); location.reload(); } });
}
let stash = null;

// ---------- bridge to the Chrome extension (protocol in issue #60) ----------
const APP = "internship-engine-app", EXT = "internship-engine-ext";
let extVersion = "";
const post = msg => window.postMessage({ source: APP, ...msg }, location.origin);
function sendProfile() {
  const p = S.profile, a = p?.autofill;
  if (!extVersion || !p) return;
  const [first_name, ...rest] = p.name.split(/\s+/);
  post({ type: "profile", profile: { ...(a || {}), first_name, last_name: a?.last_name || rest.join(" "), country: "United States",
    work_authorization: p.auth || "", needs_sponsorship: p.auth === "sponsor", eeo: "decline", resume_text: p.resume || "",
    // What the extension's daily alert counts: the same field patterns this page uses, as regex sources.
    watch: { fields: (p.fields || []).map(f => FIELDS[f][1].source), places: p.places || [] } } });
}
window.addEventListener("message", e => {
  const m = e.data;
  if (e.source !== window || e.origin !== location.origin || m?.source !== EXT) return;
  if (m.type === "hello") {
    // The extension loads after this page; whichever hello came first, answering once lets queued events flow.
    if (!extVersion) post({ type: "hello" });
    extVersion = String(m.version || "1"); sendProfile(); if (tab === "today" && S.profile) renderToday(); }
  if (m.type === "events" && Array.isArray(m.events)) {
    const done = [];
    for (const ev of m.events.slice(0, 200)) {
      if (!ev || !safeUrl(ev.url) || !["saved", "applied"].includes(ev.kind)) continue;
      const prev = S.apps[ev.url];
      if (!(prev && ev.kind === "saved")) track({ company: String(ev.company || "Unknown").slice(0, 120), title: String(ev.title || "Application").slice(0, 200), location: "", url: ev.url, ...prev }, prev && prev.status !== "saved" && ev.kind === "applied" ? prev.status : ev.kind);
      done.push(ev.id);
    }
    post({ type: "ack", ids: done });
    if (done.length) { toast(`${done.length} update${done.length > 1 ? "s" : ""} from the extension.`); if (S.profile) render(); }
  }
});

// A calendar file the viewer imports themselves; floating local time, 1 hour, 1-day reminder.
function downloadIcs(a) {
  // Wall-clock arithmetic in UTC fields: "one hour later" on the clock, even across a daylight-saving change.
  const [y, mo, d, h, mi] = a.when.split(/[-T:]/).map(Number), end = new Date(Date.UTC(y, mo - 1, d, h + 1, mi));
  const pad = n => String(n).padStart(2, "0"), t = a.when.replace(/[-:]/g, "").slice(0, 13) + "00";
  const e = `${end.getUTCFullYear()}${pad(end.getUTCMonth() + 1)}${pad(end.getUTCDate())}T${pad(end.getUTCHours())}${pad(end.getUTCMinutes())}00`;
  const clean = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\r?\n/g, " ");
  const what = a.status === "oa" ? "Assessment due" : "Interview";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Internship Engine//EN", "BEGIN:VEVENT", `UID:${Date.now()}@internship-engine`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, `DTSTART:${t}`, `DTEND:${e}`,
    `SUMMARY:${clean(`${what}: ${a.company}`)}`, `DESCRIPTION:${clean(a.title + (safeUrl(a.url) ? " — " + a.url : ""))}`,
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", `DESCRIPTION:${clean(what)}`, "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  link.download = `${a.company.replace(/[^a-z0-9]+/gi, "-")}-${a.status}.ics`; link.click();
}

// PDF text extraction happens in this browser with pdf.js (pinned + integrity-checked); the file is never uploaded.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file) {
  if (!window.pdfjsLib) {
    await new Promise((ok, fail) => {
      const sc = document.createElement("script");
      Object.assign(sc, { src: PDFJS + "pdf.min.js", integrity: "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e", crossOrigin: "anonymous", onload: ok, onerror: fail });
      document.head.append(sc);
    });
    // Workers must be same-origin, so fetch the worker with its own integrity check and run it from a blob.
    const w = await fetch(PDFJS + "pdf.worker.min.js", { integrity: "sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2" });
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await w.blob());
  }
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 5); i++) pages.push((await (await doc.getPage(i)).getTextContent()).items.map(x => x.str).join(" "));
  return pages.join("\n");
}

// ---------- events ----------
document.addEventListener("click", e => {
  const co = e.target.closest("[data-company]");
  if (co) { Object.assign(jobQuery, { q: co.dataset.company, field: "all", where: "any", season: "", shown: PAGE }); tab = "jobs"; return render(); }
  const ai = e.target.closest("[data-ai]");
  if (ai) { const r = FEED.find(x => x.url === $("#jobBody").dataset.url); return navigator.clipboard.writeText(aiPrompt(ai.dataset.ai, r)).then(() => toast("Prompt copied — paste it into ChatGPT, Claude or Gemini."), () => toast("Couldn't copy — your browser blocked the clipboard.")); }
  const cp = e.target.closest("[data-copy]");
  if (cp) return navigator.clipboard.writeText(cp.dataset.copy).then(() => toast("Note copied — paste it into LinkedIn yourself."), () => toast(cp.dataset.copy));
  const sib = e.target.closest("[data-sib]");
  if (sib) { e.preventDefault(); return openJob(FEED.find(x => x.url === sib.dataset.sib)); }
  const t = e.target.closest("[data-tab],[data-go],[data-act],#me,#me2,#addApp,#exportBtn,#phoneBtn,#theme,#invite");
  if (!t) return;
  if (t.id === "theme") {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    S.theme = document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; return save();
  }
  if (t.id === "invite") {
    const url = new URL("./", location.href).href, text = "Free internship finder + tracker — pulls roles straight from company job boards:";
    if (navigator.share) return navigator.share({ title: "Internship Engine", text, url }).catch(() => {});
    return navigator.clipboard.writeText(url).then(() => toast("Link copied — send it to a friend."), () => toast(url));
  }
  if (t.dataset.tab || t.dataset.go) { tab = t.dataset.tab || t.dataset.go; return render(); }
  if (t.id === "me" || t.id === "me2") { tab = "profile"; stash = null; return render(); }
  if (t.id === "addApp") { const f = $("#addForm"); f.reset(); f.status.innerHTML = STAGES.map(([k, l]) => `<option value="${k}" ${k === "applied" ? "selected" : ""}>${l}</option>`).join(""); return $("#addDlg").showModal(); }
  if (t.id === "phoneBtn") return handoffLink().then(url => {
    // Building the link is async, which uses up the click's clipboard permission, so the copy gets its own button.
    $("#jobBody").innerHTML = `<button class="icon-btn" data-act="close" aria-label="Close" style="position:absolute;top:14px;right:14px">✕</button>
      <h2 id="jobTitle">Open on another device</h2>
      <p class="muted" style="margin:0">This link carries your profile and tracker (not your LinkedIn contacts). Open it on your phone or laptop and they merge in. Treat it like a password: anyone with it sees your tracker.</p>
      <input class="t" id="handoffUrl" readonly value="${esc(url)}" aria-label="Link">
      <div class="actions" style="margin-top:0"><span></span><span style="display:flex;gap:8px">${navigator.share ? `<button class="btn" id="handoffShare">Share</button>` : ""}<button class="btn go" data-copy="${esc(url)}">Copy link</button></span></div>`;
    $("#jobDlg").open || $("#jobDlg").showModal();
    $("#handoffShare")?.addEventListener("click", () => navigator.share({ title: "Internship Engine", url }).catch(() => {}));
  });
  if (t.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = `internship-engine-backup-${today()}.json`; a.click(); return;
  }
  const row = t.closest("[data-url]"), r = row && FEED.find(x => x.url === row.dataset.url);
  if (t.dataset.act === "close") return $("#jobDlg").close();
  if (t.dataset.act === "ics") return downloadIcs(S.apps[t.closest(".app").dataset.url]);
  if (t.dataset.act === "prep") return openPrep(S.apps[t.closest(".app").dataset.url]);
  if (t.dataset.act === "open" && r) return openJob(r);
  if (t.dataset.act === "hide" && r) {
    S.hidden.push(r.url); save(); $("#jobDlg").close(); render(); landFocus(); return toast("Hidden. You won't see it again.");
  }
  if (t.dataset.act === "save" && r) {
    if (S.apps[r.url]) { tab = "tracker"; return render(); }
    track(r, "saved"); t.classList.add("on"); t.textContent = "Saved"; toast("Saved to your tracker.");
  }
  if (t.dataset.act === "apply" && r && !S.apps[r.url]) {
    // Opening the form isn't applying; we ask when they come back so the tracker stays honest.
    pendingApply = r;
  }
});
let pendingApply = null;
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]") || e.metaKey || e.ctrlKey) return;
  const rows = [...document.querySelectorAll(".job")], i = rows.indexOf(document.activeElement.closest?.(".job"));
  if (e.key === "j" || e.key === "k") { const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "j" ? 1 : -1)))]; n?.focus(); n?.scrollIntoView({ block: "nearest" }); }
  if (i >= 0 && (e.key === "o" || e.key === "Enter")) rows[i].querySelector("[data-act=open]").click();
  if (i >= 0 && e.key === "s") rows[i].querySelector("[data-act=save]").click();
});
document.addEventListener("keydown", e => {
  if (e.key !== "/" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]")) return;
  e.preventDefault(); if (tab !== "jobs") { tab = "jobs"; render(); } $("#q")?.focus();
});
window.addEventListener("focus", () => {
  if (!pendingApply) return;
  const r = pendingApply; pendingApply = null;
  setTimeout(() => { if (confirm(`Did you apply to ${r.company}?`)) { track(r, "applied"); toast("Tracked as applied."); render(); } }, 150);
});
document.addEventListener("change", e => {
  if (e.target.id === "importIn") return restore(e.target.files[0]);
  if (e.target.id === "csvIn") return e.target.files[0]?.text().then(t => { try { toast(`${importContacts(t).toLocaleString()} connections loaded.`); render(); } catch (err) { toast(err.message === "too big" ? "Too many connections for this browser's storage." : "That isn't LinkedIn's Connections.csv."); } });
  const card = e.target.closest(".app");
  if (!card) return;
  if (e.target.dataset.act === "stage") move(card.dataset.url, e.target.value);
  if (e.target.dataset.act === "when") { S.apps[card.dataset.url].when = e.target.value; save(); return renderTracker(); }
  if (e.target.dataset.check) { const a = S.apps[card.dataset.url]; a.checks = { ...a.checks, [e.target.dataset.check]: e.target.checked }; return save(); }
  if (e.target.dataset.act === "notes") { S.apps[card.dataset.url].notes = e.target.value.slice(0, 2000); save(); }
});
async function restore(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== "object" || !d.apps || typeof d.apps !== "object" || Array.isArray(d.apps)) throw 0;
    S = fresh(d); PV++; KNOWN = null; save(); counts(); render(); toast("Restored.");
  } catch { toast("That file isn't an Internship Engine backup."); }
}
$("#addDlg").addEventListener("close", () => {
  if ($("#addDlg").returnValue !== "ok") return;
  const f = $("#addForm"), url = safeUrl(f.url.value) || `manual:${Date.now()}`;
  track({ company: f.company.value.trim(), title: f.title.value.trim(), location: "", url }, f.status.value);
  toast("Added."); render(); landFocus();
});
// After a dialog action rerenders the page its opener is gone; land on the page heading instead of <body>.
function landFocus() { const h = $("main h1"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }

if (S.theme) document.documentElement.dataset.theme = S.theme;
// Offline + instant load (sw.js). Failure is harmless: the page works the same without it.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  view.innerHTML = `<div class="empty">Loading today's internships…</div>`;
  await loadFeed(); await importFromHash(); counts(); render(); post({ type: "hello" });
  // Pasting the link into a tab that already has the app open only changes the #fragment.
  window.addEventListener("hashchange", () => importFromHash().then(() => { counts(); render(); }));
})();
</script>
